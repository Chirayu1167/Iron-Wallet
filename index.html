/* ═══ ROOT APP ═══ */
function App(){
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  // Phase 1G: persist txs/balance to localStorage — existing architecture, no new DB
  const [txs, setTxs] = useState(()=>{
    try{ const v=localStorage.getItem("iron_txs"); return v? JSON.parse(v) : SEED_TXS; }catch{ return SEED_TXS; }
  });
  const [balance, setBalance] = useState(()=>{
    try{ const v=localStorage.getItem("iron_balance"); return v? JSON.parse(v) : 0; }catch{ return 0; }
  });
  const [requests, setRequests] = useState(SEED_REQS);
  const [showAssistant, setShowAssistant] = useState(false);
  const [tickets, setTickets] = useState([]);
  const [wsToast, setWsToast] = useState("");        // real-time credit toast

  // ── Stable refs for socket callbacks ─────────────────────────────────
  const socketRef = useRef(null);
  const userRef   = useRef(null);
  const addTxRef  = useRef(null);
  const updBalRef = useRef(null);

  // ── WS connection status (drives the dot in the header) ─────────────
  const [wsStatus, setWsStatus] = useState("connecting"); // "connecting"|"connected"|"error"

  // ── Socket initialization (once, on mount) ────────────────────────────
  useEffect(() => {
    // Derive WS server URL from current hostname so cross-device works.
    // WebSocket server runs as a separate Railway service.
    // Replace the URL below with your Railway WS service domain after deploying.
    const wsUrl = window.__WS_URL__ || "https://determined-vibrancy.up.railway.app";
    console.log("[IronWallet WS] Connecting to:", wsUrl);

    const socket = io(wsUrl, {
      // ✅ FIX 1: Always start with polling so the initial HTTP handshake
      //    succeeds, then upgrade to WebSocket. "websocket"-only silently
      //    fails when the server is not yet ready or a proxy is in the way.
      transports: ["polling", "websocket"],
      reconnectionDelay:    1000,
      reconnectionDelayMax: 5000,
      reconnectionAttempts: Infinity,
      timeout: 10000,
    });

    socketRef.current = socket;
    window._ptSocket  = socket;   // global handle for SendMoneyPage

    // ── CONNECT ──────────────────────────────────────────────────────────
    socket.on("connect", () => {
      console.log("[IronWallet WS] ✅ Connected  socket.id:", socket.id,
                  "| transport:", socket.io.engine.transport.name);
      setWsStatus("connected");

      // Re-register on every (re)connect — Phase 2K: send token for auth
      if (userRef.current) {
        const tok = (()=>{ try{ return localStorage.getItem("iron_token"); }catch{ return null; } })();
        socket.emit("user_register", {number: userRef.current.number, token: tok}, (ack) => {
          console.log("[IronWallet WS] Re-registered:", userRef.current?.number, ack);
        });
      }
    });

    // ── CONNECT ERROR ─────────────────────────────────────────────────────
    // ✅ FIX 2: Catch and surface connection failures
    socket.on("connect_error", (err) => {
      console.error("[IronWallet WS] ❌ connect_error:", err.message);
      setWsStatus("error");
    });

    // ── DISCONNECT ───────────────────────────────────────────────────────
    socket.on("disconnect", (reason) => {
      console.warn("[IronWallet WS] Disconnected:", reason);
      setWsStatus("connecting");
    });

    // ── RECEIVE PAYMENT (credit the receiver's account) ──────────────────
    socket.on("receive_payment", (data) => {
      console.log("[IronWallet WS] 💰 receive_payment:", data);
      const { fromNumber, amount, txId, timestamp, note } = data;
      const now = new Date(timestamp || Date.now());
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const dateStr = `${String(now.getDate()).padStart(2,"0")} ${months[now.getMonth()]} ${String(now.getFullYear()).slice(2)}`;
      const timeStr = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

      const sender      = USERS[fromNumber];
      const senderName  = sender ? sender.name : fromNumber;

      const tx = {
        id:      txId || Date.now(),
        from:    senderName,
        fromNum: fromNumber,
        amt:     Number(amount),
        date:    dateStr,
        time:    timeStr,
        risk:    0,
        status:  "success",
        type:    "credit",
        note:    note || "Payment received",
        isNew:   true,
      };

      // Stable refs — never stale even though socket handler is created once
      if (addTxRef.current)  addTxRef.current(tx);
      if (updBalRef.current) updBalRef.current(b => b + Number(amount));

      setWsToast(`💰 Received ₹${Number(amount).toLocaleString("en-IN")} from ${senderName}`);
      setTimeout(() => setWsToast(""), 4500);
    });

    // ── FRAUD WARNING ────────────────────────────────────────────────────
    socket.on("fraud_warning", (data) => {
      console.warn("[IronWallet WS] 🚨 fraud_warning:", data);
      setWsToast(`🚨 Fraud Alert: ${data.reason || "Suspicious activity detected"}`);
      setTimeout(() => setWsToast(""), 5500);
    });

    // ── CLEANUP ──────────────────────────────────────────────────────────
    return () => {
      socket.off("connect");
      socket.off("connect_error");
      socket.off("disconnect");
      socket.off("receive_payment");
      socket.off("fraud_warning");
      socket.disconnect();
      socketRef.current = null;
      window._ptSocket  = null;
    };
  }, []); // eslint-disable-line — intentionally run once

  function handleLogin(u){
    setUser(u);
    userRef.current = u;
    // Immediate local balance to avoid Zero Balance flash, then authoritative fetch
    setBalance(u.balance);
    // Phase 2/3: fetch authoritative balance & transactions from backend
    try{
      const hdr=getAuthHeader();
      if(hdr.Authorization){
        fetch(`${API}/balance`,{headers: hdr}).then(r=>r.json()).then(j=>{ if(j.balance!=null) setBalance(j.balance); localStorage.setItem("iron_balance", JSON.stringify(j.balance!=null? j.balance : u.balance)); }).catch(()=>{ setBalance(u.balance); try{ localStorage.setItem("iron_balance", JSON.stringify(u.balance)); }catch{} });
        fetch(`${API}/transactions?limit=100`,{headers: hdr}).then(r=>r.json()).then(j=>{ if(j.transactions) setTxs(j.transactions.map(x=>({id:x.transaction_id, to:x.recipient_name||x.recipient, toNum:x.recipient, amt:x.amount, date:x.timestamp.slice(0,10), time:x.timestamp.slice(11,16), risk:x.risk_score, status:x.status==="SUCCESS"?"success":x.status==="HIGH_RISK"?"high_risk":x.status.toLowerCase(), type:"debit", note:x.note, isNew:false, risk_tag:x.risk_tier?.toLowerCase()||"normal", otp_used:x.verification_method==="OTP"}))); }).catch(()=>setTxs(SEED_TXS));
      } else {
        // Fallback to local if no token – clear stale local 0 and use u.balance
        try{ localStorage.removeItem("iron_balance"); localStorage.removeItem("iron_txs"); }catch{}
        setBalance(u.balance);
        setTxs(SEED_TXS);
        try{ localStorage.setItem("iron_balance", JSON.stringify(u.balance)); }catch{}
      }
    }catch{ setBalance(u.balance); setTxs(SEED_TXS); }
    setRequests(SEED_REQS);
    // Phase 1I: initialize geo/device baseline on login if available
    try{ if(typeof captureBaseline==="function") captureBaseline(()=>console.log("[IRON] captureBaseline done")); }catch(e){ console.warn("captureBaseline failed",e); }
    // Persist baseline to backend if location available
    try{ const dev = (typeof getDeviceInfo==="function"? getDeviceInfo():null); const loc = (typeof GeoDeviceBaseline!=="undefined"? GeoDeviceBaseline.location:null); const hdr=getAuthHeader(); if(hdr.Authorization) fetch(`${API}/device/baseline`,{method:"POST", headers:{...hdr, "Content-Type":"application/json"}, body: JSON.stringify({device:dev, location:loc})}).catch(()=>{}); }catch{}
    // Register with WS server as soon as the user is known — Phase 2K token
    if (socketRef.current?.connected) {
      const tok = (()=>{ try{ return localStorage.getItem("iron_token"); }catch{ return null; } })();
      socketRef.current.emit("user_register", {number: u.number, token: tok}, (ack) => {
        if (ack?.success) console.log("[IronWallet WS] Registered:", u.number, `(${ack.connections} conn)`);
      });
    }
  }

  function handleLogout(){
    if (socketRef.current && userRef.current) {
      socketRef.current.emit("user_leave", userRef.current.number);
      console.log("[IronWallet WS] user_leave:", userRef.current.number);
    }
    try{ localStorage.removeItem("iron_token"); localStorage.removeItem("iron_user"); }catch{}
    // Optionally call backend to delete session
    try{ const hdr=getAuthHeader(); if(hdr.Authorization) fetch(`${API}/auth/logout`,{method:"POST", headers: hdr}).catch(()=>{}); }catch{}
    userRef.current = null;
    setUser(null);
    setPage("dashboard");
  }

  function addTx(tx){
    setTxs(prev => [tx, ...prev]);
  }
  addTxRef.current = addTx; // keep ref current
  // Phase 1G persistence: save txs/balance on change
  useEffect(()=>{ try{ localStorage.setItem("iron_txs", JSON.stringify(txs.slice(0,100))); }catch{} }, [txs]);
  useEffect(()=>{ try{ localStorage.setItem("iron_balance", JSON.stringify(balance)); }catch{} }, [balance]);

  function updateBalance(fn){
    setBalance(prev => Math.max(0, fn(prev)));
  }
  updBalRef.current = updateBalance; // keep ref current

  function resolveRequest(id, status){
    setRequests(prev => prev.map(r => r.id === id ? {...r, status} : r));
  }

  function updateUser(updates){
    setUser(prev => ({...prev, ...updates}));
  }

  function createTicket(tx, reason, note, currentUser, ticketId){
    const id = ticketId || ("PT-" + Math.floor(Math.random()*100000));
    const now = Date.now();
    const recipient = tx.toNum || tx.fromNum || "";
    const amount = tx.amt;
    const sev = getFraudSeverity(reason);
    const ticket = {
      id,
      transaction_id: tx.id,
      user: currentUser.number,
      recipient,
      recipientName: tx.to || tx.from || recipient,
      amount,
      reason,
      note,
      status: "Under Review",
      refund_status: "Pending",
      created_at: now,
      severity: sev,
      timeline: [{ status: "Submitted", time: now }, { status: "Sent to Bank", time: now + 5000 }, { status: "Sent to Cyber Cell", time: now + 10000 }]
    };
    // Integrate with existing recipient risk system
    reportRecipient(currentUser.number, recipient, amount, reason);
    setTickets(prev => [ticket, ...prev]);
    return id;
  }

  function updateTicketStatus(id, status, refund_status){
    setTickets(prev => prev.map(t => t.id === id ? {
      ...t, status, refund_status,
      timeline: [...t.timeline, { status, time: Date.now() }]
    } : t));
  }

  const pendingCount = requests.filter(r => r.status === "pending").length;

  if(!user) return <LoginPage onLogin={handleLogin}/>;

  const pp = {user, txs, balance, setPage, addTx, updateBalance, requests, resolveRequest, updateUser, tickets, createTicket, updateTicketStatus};

  return (
    <div style={{display:"flex",minHeight:"100vh",fontFamily:"'Inter',sans-serif",
      background:"#FDFCFB",position:"relative"}}>
      <main id="main-content" style={{flex:1,overflowY:"auto",maxHeight:"100vh",position:"relative",paddingBottom:120}}>
          <div key={page}>
            {page === "dashboard"     && <Dashboard {...pp}/>}
            {page === "send"          && <SendMoneyPage {...pp}/>}
            {page === "request-money" && <RequestMoneyPage {...pp}/>}
            {page === "requests"      && <RequestsPage {...pp}/>}
            {page === "history"       && <HistoryPage txs={txs} user={user} tickets={tickets} createTicket={createTicket} setPage={setPage}/>}
            {page === "finance"       && <FinanceAnalyticsPage txs={txs} user={user}/>}
            {page === "insights"      && <InsightsPage {...pp}/>}
            {page === "profile"       && <ProfilePage {...pp}/>}
            {page === "protection"    && <ProtectionCenter user={user} txs={txs} setPage={setPage}/>}
            {page === "security"      && <SecurityCenter user={user} setPage={setPage}/>}
            {page === "smartguard"   && <SmartGuardPage {...pp}/>}
            {page === "redeem"        && <RedeemPage {...pp}/>}
            {page === "rbi"           && <RBIGuidelinesPage {...pp}/>}
          </div>

          <button className="nexus-launcher"
            onClick={() => setShowAssistant(true)}
            style={{position:"fixed",bottom:24,left:24,zIndex:100,
              width:54,height:54,borderRadius:6,background:"#1B263B",
              border:"1px solid rgba(197,160,89,.25)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
              boxShadow:"0 8px 32px rgba(27,38,59,.2)"}}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
        </main>
        <Dock page={page} setPage={setPage} onLogout={handleLogout} pendingCount={pendingCount}/>

      {showAssistant && <SafePayAssistant user={user} txs={txs} onClose={() => setShowAssistant(false)}/>}

      {/* ── Real-time WebSocket toast (credit / fraud warning) ── */}
      {wsToast && (
        <div className="pt-toast" style={{
          background: wsToast.startsWith("💰") ? "#0f3d20" : "#3d0f0f",
          borderTop: `3px solid ${wsToast.startsWith("💰") ? "#22c55e" : "#ef4444"}`,
          color: "#fff",
          fontSize: 14,
          fontWeight: 700,
          padding: "12px 26px",
          borderRadius: 28,
          bottom: 100,
          letterSpacing: "-.1px",
          boxShadow: "0 8px 32px rgba(0,0,0,.32)",
        }}>
          {wsToast}
        </div>
      )}

    </div>
  );
