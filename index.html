function Modal({children}){
  const el=useRef(document.getElementById("modal-root"));
  useEffect(()=>{
    document.body.style.overflow="hidden";
    return()=>{document.body.style.overflow="";};
  },[]);
  return createPortal(
    <div style={{
      position:'fixed',top:0,left:0,right:0,bottom:0,
      background:'rgba(15,23,42,0.65)',
      backdropFilter:'blur(4px)',WebkitBackdropFilter:'blur(4px)',
      display:'flex',alignItems:'center',justifyContent:'center',
      zIndex:10000,padding:'16px'

      {children}
    </div>,

  );
}

function Btn({children,onClick,variant="primary",disabled,style={},fullWidth}){
  const vars={
    primary:{background:disabled?"rgba(27,38,59,0.4)":"#1B263B",color:disabled?"rgba(255,255,255,0.5)":"#fff",

  );
}

/* ═══ LOGIN PAGE ═══ */
function LoginPage({onLogin}){
  const[mobile,setMobile]=useState("");
  const[pin,setPin]=useState("");
  const[showPin,setShowPin]=useState(false);
  const[otp,setOtp]=useState("");
  const[otpMode,setOtpMode]=useState(false);
  const[msg,setMsg]=useState({text:"",ok:false});
  const[loading,setLoading]=useState(false);
  const[timer,setTimer]=useState(0);
  const[resend,setResend]=useState(false);
  const[pinAttempts,setPinAttempts]=useState(0);
  const[pinLockedUntil,setPinLockedUntil]=useState(null);
  const[mobileErr,setMobileErr]=useState(""); // FEATURE: mobile validation error

  useEffect(()=>{
    if(timer<=0){setResend(true);return;}
    const t=setTimeout(()=>setTimer(p=>p-1),1000);
    return()=>clearTimeout(t);
  },[timer]);

  useEffect(()=>{
    if (pinLockedUntil && new Date() < new Date(pinLockedUntil)) {
      const timer = setInterval(() => {
        if (new Date() >= new Date(pinLockedUntil)) {
          setPinLockedUntil(null);
          setPinAttempts(0);
        }
      }, 1000);
      return () => clearInterval(timer);
    }
  }, [pinLockedUntil]);

  async function handleLogin(){
    setMsg({text:"",ok:false});
    
    if (pinLockedUntil && new Date() < new Date(pinLockedUntil)) {
      const remaining = Math.ceil((new Date(pinLockedUntil) - new Date()) / 1000);
      setMsg({text:`Too many attempts. Try again in ${remaining}s`, ok:false});
      return;
    }
    
    if(!otpMode){
      // FEATURE: Validate mobile is exactly 10 digits before proceeding
      const cleanMobile = mobile.replace(/\D/,"");
      if (cleanMobile.length !== 10) {
        setMobileErr("Enter a valid 10-digit mobile number");
        return;
      }
      setMobileErr("");
      const u=Object.entries(USERS).find(([,v])=>v.number===mobile);
      if(!u){setMsg({text:"Invalid Mobile",ok:false}); return;}
      
      if (pin !== u[1].pin) {
        const newAttempts = pinAttempts + 1;
        setPinAttempts(newAttempts);
        if (newAttempts >= 3) {
          setPinLockedUntil(new Date(Date.now() + 7 * 60000).toISOString());
          setMsg({text:"Too many incorrect PINs. Try again in 7 minutes.", ok:false});
        } else {
          setMsg({text:`Incorrect PIN. ${3 - newAttempts} attempt(s) left.`, ok:false});
        }
        return;
      }

      // Admin user - skip OTP server call, accept constant OTP 000000
      if (u[1].isAdmin) {
        setOtpMode(true); setTimer(999); setResend(true);
        setMsg({text:"Admin login — OTP 000000 will be accepted ✔", ok:true});
        setPinAttempts(0);
        return;
      }

      setLoading(true);
      try{
        const res=await fetch(`${API}/send-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile})});
        const data=await res.json().catch(()=>({}));
        if(res.status===429 || data.status==="RATE_LIMITED"){
          const msg=data.message||"Too many requests. Please wait.";
          const secs=parseInt((msg.match(/(\d+)s/)?.[1]||"30"),10);
          setMsg({text:msg,ok:false}); setTimer(secs); setResend(false);
        } else if(res.status===502){
          setMsg({text:data.message||"SMS service unavailable. Try again.",ok:false});
        } else if(res.ok || data.status==="OTP_SENT"){
          setOtpMode(true);setTimer(30);setResend(false);
          setMsg({text:"OTP sent to your registered mobile 📲",ok:true});
          setPinAttempts(0);
        } else {
          setMsg({text:data.message||"Failed to send OTP. Try again.",ok:false});
        }
      }catch(e){setMsg({text:"Backend unreachable. Is server running?",ok:false});}
      finally{setLoading(false);}
    }else{
      // Admin user - still verify via backend to get token/balance (was skipping token before → balance 0)
      if (mobile === "1234567890" && otp === "000000") {
        setLoading(true);
        try{
          const res=await fetch(`${API}/verify-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile,otp})});
          const data=await res.json().catch(()=>({}));
          if(data.token){ try{ localStorage.setItem("iron_token", data.token); localStorage.setItem("iron_user", mobile); }catch{} }
          if(data.status==="SUCCESS" || data.token){
            setMsg({text:"Login Successful ✔",ok:true});
            const u=Object.entries(USERS).find(([,v])=>v.number===mobile);
            // Ensure authoritative balance from backend
            try{ if(data.token){ const rr=await fetch(`${API}/auth/me`,{headers:{"Authorization":"Bearer "+data.token}}); const jj=await rr.json().catch(()=>({})); if(jj.balance!=null) u[1].balance=jj.balance; } }catch{}
            setTimeout(()=>onLogin({...u[1]}),500);
            return;
          }
        }catch(e){}
        // Fallback local if backend unreachable
        setMsg({text:"Login Successful ✔",ok:true});
        const u=Object.entries(USERS).find(([,v])=>v.number===mobile);
        setTimeout(()=>onLogin({...u[1]}),500);
        return;
      }
      setLoading(true);
      try{
        const res=await fetch(`${API}/verify-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile,otp})});
        const data=await res.json().catch(()=>({}));
        if(data.status==="SUCCESS"){
          // Phase 2B: store token for authenticated requests
          if(data.token){ try{ localStorage.setItem("iron_token", data.token); localStorage.setItem("iron_user", mobile); }catch{} }
          setMsg({text:"Login Successful ✔",ok:true});
          const u=Object.entries(USERS).find(([,v])=>v.number===mobile);
          // Also ensure backend user exists (seeded) — fetch authoritative profile
          try{ const tok=data.token||localStorage.getItem("iron_token"); if(tok){ fetch(`${API}/auth/me`,{headers:{...getAuthHeader(), "Authorization":"Bearer "+tok}}).then(r=>r.json()).then(j=>{ if(j.balance!=null) u[1].balance=j.balance; }).catch(()=>{}); } }catch{}
          setTimeout(()=>onLogin({...u[1]}),500);
        }else if(data.status==="RATE_LIMITED"){
          setMsg({text:data.message||"Too many attempts. Try again later.",ok:false});
          const secs=parseInt((data.message||"").match(/(\d+)s/)?.[1]||"30",10);
          setTimer(secs); setResend(false);
        }else if(data.status==="OTP_EXPIRED"){setMsg({text:"OTP expired. Resend.",ok:false});}
        else if(data.status==="INVALID"){
          setMsg({text:data.message||"Invalid OTP. Try again.",ok:false});
        }
        else{setMsg({text:data.message||"Invalid OTP. Try again.",ok:false});}
      }catch(e){setMsg({text:"Backend unreachable. Is server running?",ok:false});}
      finally{setLoading(false);}
    }
  }

  async function handleResend(){
    try{
      const res=await fetch(`${API}/send-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile})});
      const data=await res.json().catch(()=>({}));
      if(res.status===429 || data.status==="RATE_LIMITED"){
        const msg=data.message||"Please wait before resending";
        setMsg({text:msg,ok:false});
        const secs=parseInt((msg.match(/(\d+)s/)?.[1]||"30"),10);
        setTimer(secs); setResend(false);
        return;
      }
      if(res.ok || data.status==="OTP_SENT"){ setTimer(30); setResend(false); setMsg({text:"OTP resent 📲",ok:true});}
      else { setMsg({text:data.message||"Failed to resend. Try again.",ok:false}); }
    }catch(e){setMsg({text:"Server unreachable.",ok:false});}
  }

  const ready=!loading&&((!otpMode&&mobile.length===10&&pin.length===4)||(otpMode&&otp.length===6));

  return(

/* ═══ OTP MODAL ═══ */
function OTPModal({mobile,onSuccess,onCancel}){
  const[digits,setDigits]=useState(["","","","","",""]);
  const[error,setError]=useState(false);
  const[errMsg,setErrMsg]=useState("Invalid OTP.");
  const[timer,setTimer]=useState(30);
  const[resend,setResend]=useState(false);
  const[loading,setLoad]=useState(false);
  const refs=[useRef(),useRef(),useRef(),useRef(),useRef(),useRef()];

  useEffect(()=>{refs[0].current&&refs[0].current.focus();},[]);
  useEffect(()=>{
    if(timer<=0){setResend(true);return;}
    const t=setTimeout(()=>setTimer(p=>p-1),1000);
    return()=>clearTimeout(t);
  },[timer]);
  /* Auto-send OTP as soon as this modal opens (skip for admin - uses static OTP) */
  useEffect(()=>{
    if (mobile === "1234567890") return;
    fetch(`${API}/send-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile})}).catch(()=>{});
  },[]);

  function type(i,e){
    const v=e.target.value.replace(/\D/,"");
    const d=[...digits];d[i]=v;setDigits(d);
    if(v&&i<5)refs[i+1].current&&refs[i+1].current.focus();
  }
  function bk(i,e){
    if(e.key==="Backspace"&&!digits[i]&&i>0){
      refs[i-1].current&&refs[i-1].current.focus();
      const d=[...digits];d[i-1]="";setDigits(d);
    }
  }
  async function submit(code){
    // Admin user - skip OTP server call, accept constant OTP 000000
    // (pass the code through so confirm sends it and backend marks OTP_SUCCESS)
    if (mobile === "1234567890" && code === "000000") {
      onSuccess("000000");
      return;
    }
    setLoad(true);
    try{
      const res=await fetch(`${API}/verify-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile,otp:code})});
      const data=await res.json().catch(()=>({}));
      if(data.status==="SUCCESS"){onSuccess(code);}
      else if(data.status==="RATE_LIMITED"){
        setErrMsg(data.message||"Too many attempts. Try again later.");
        setError(true);
        const secs = parseInt((data.message||"").match(/(\d+)s/)?.[1]||"30",10);
        setTimer(secs); setResend(false);
        setTimeout(()=>{setError(false);},2500);
      }
      else{
        const msg = data.message || (data.status==="OTP_EXPIRED"?"OTP expired. Resend.": data.status==="INVALID"?"Invalid OTP. Try again.": "Invalid OTP.");
        setErrMsg(msg);
        setError(true);
        setTimeout(()=>{setError(false);setDigits(["","","","","",""]);refs[0].current&&refs[0].current.focus();},900);
      }
    }catch(e){
      if(e.message && e.message.includes("RATE_LIMITED")){setErrMsg(e.message);} else {setErrMsg("Server unreachable.");}
      setError(true);
      setTimeout(()=>{setError(false);setDigits(["","","","","",""]);},900);
    }finally{setLoad(false);}
  }
  async function resendOTP(){
    if (mobile === "1234567890") return;
    try{
      const res=await fetch(`${API}/send-otp`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile})});
      const data=await res.json().catch(()=>({}));
      if(res.status===429 || data.status==="RATE_LIMITED"){
        const msg=data.message||"Please wait before resending";
        setErrMsg(msg); setError(true);
        const secs = parseInt((msg.match(/(\d+)s/)?.[1]||"30"),10);
        setTimer(secs); setResend(false);
        setTimeout(()=>setError(false),2500);
        return;
      }
      if(data.status==="OTP_SENT" || res.ok){ setTimer(30); setResend(false); setError(false); }
      else if(data.message){ setErrMsg(data.message); setError(true); setTimeout(()=>setError(false),2000); }
    }catch(e){ setErrMsg("Server unreachable."); setError(true); setTimeout(()=>setError(false),2000); }
  }

  useEffect(()=>{
    document.body.style.overflow="hidden";
    return()=>{document.body.style.overflow="";};
  },[]);

  return(
    <Modal>
      <div style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",zIndex:9999,
        overflowY:"auto",overscrollBehavior:"contain",
        background:"transparent",backdropFilter:"none",WebkitBackdropFilter:"none"}}>
        <div style={{minHeight:"100%",display:"flex",alignItems:"center",justifyContent:"center",
          padding:"20px",boxSizing:"border-box"}}>
          <div style={{background:"#fff",borderRadius:8,width:"100%",maxWidth:380,
            boxShadow:"0 32px 80px rgba(0,0,0,.28)",animation:"scaleIn .28s cubic-bezier(.16,1,.3,1)",
            overflow:"hidden",flexShrink:0}}>
            <div style={{background:"#F7F8FA",padding:"20px 24px 16px",textAlign:"center",borderBottom:"1px solid #E5E7EB"}}>
              <div style={{width:50,height:50,borderRadius:"50%",background:"#FFF1E8",
                display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px"}}>
                <svg width="24"height="24"viewBox="0 0 48 48">
                  <path d="M24 4L6 12v14c0 12 7.6 23.2 18 26 10.4-2.8 18-14 18-26V12L24 4z"fill="none"stroke="#FF6B00"strokeWidth="2.5"/>
                  <polyline points="16 24 22 30 34 18"fill="none"stroke="#FF6B00"strokeWidth="2.8"strokeLinecap="round"strokeLinejoin="round"/>
                </svg>
              </div>
              <h3 style={{fontWeight:800,fontSize:18,color:"#111827",marginBottom:3}}>OTP Verification</h3>
              <p style={{fontSize:12,color:"#667085"}}>6-digit code sent to +91 {mobile}</p>
            </div>
            <div style={{padding:"20px 22px 22px"}}>
              <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:12,
                animation:error?"shake .4s ease":"none"}}>
                {digits.map((d,i)=>(
                  <input key={i} ref={refs[i]} maxLength={1} value={d}
                    onChange={e=>type(i,e)} onKeyDown={e=>bk(i,e)}
                    style={{width:44,height:52,textAlign:"center",fontSize:22,fontWeight:700,
                      border:`2px solid ${error?"#fca5a5":d?"rgba(27,38,59,0.35)":"#e2e8f0"}`,
                      borderRadius:6,outline:"none",color:"#1A1C1A",fontFamily:"'Inter',sans-serif",
                      background:error&&!d?"#fef2f2":d?"#f0f6ff":"#f8faff",
                      transition:"all .15s",boxSizing:"border-box"}}/>
                ))}
              </div>
              {error&&<p style={{color:"#ba1a1a",textAlign:"center",fontSize:13,marginBottom:10,fontWeight:600}}>{errMsg}</p>}
              {loading&&<p style={{textAlign:"center",fontSize:13,color:"#C5A059",marginBottom:10,fontWeight:600,animation:"pulse 1s infinite"}}>Verifying…</p>}
              <Btn onClick={()=>submit(digits.join(""))} disabled={loading||digits.some(d=>!d)} fullWidth>
                {loading ? "Verifying…" : "Verify OTP"}
              </Btn>
              <div style={{textAlign:"center",color:"#75777D",fontSize:13,marginBottom:16}}>
                {resend
                  ?<button onClick={resendOTP} style={{background:"none",border:"none",color:"#C5A059",
                    fontSize:13,cursor:"pointer",fontWeight:600,fontFamily:"'Inter',sans-serif"}}>
                    Resend OTP →</button>
                  :`Resend in ${timer}s`}
              </div>
              <Btn onClick={onCancel} variant="ghost" fullWidth>Cancel</Btn>
            </div>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* ===== ENHANCED PINModal: 3 wrong attempts → 5-min account freeze ===== */
function PINModal({userPin, onSuccess, onCancel, user}){
  const[digits,setDigits]=useState(["","","",""]);
  const[error,setError]=useState(false);
  const[loading,setLoad]=useState(false);
  const[attempts,setAttempts]=useState(0);
  const[pinFrozen,setPinFrozen]=useState(false);
  const[freezeSecs,setFreezeSecs]=useState(300);
  const[errMsg,setErrMsg]=useState("Incorrect PIN. Try again.");
  const refs=[useRef(),useRef(),useRef(),useRef()];
  const MAX_ATTEMPTS=3;
  const FREEZE_SECS=300;

  useEffect(()=>{
    if(refs[0].current) refs[0].current.focus();
  },[]);

  // Countdown when frozen
  useEffect(()=>{
    if(!pinFrozen) return;
    if(freezeSecs<=0){setPinFrozen(false);setAttempts(0);setFreezeSecs(FREEZE_SECS);return;}
    const t=setTimeout(()=>setFreezeSecs(s=>s-1),1000);
    return()=>clearTimeout(t);
  },[pinFrozen,freezeSecs]);

  function type(i,e){
    if(pinFrozen) return;
    const v=e.target.value.replace(/\D/,"");
    const d=[...digits];d[i]=v;setDigits(d);
    if(v&&i<3)refs[i+1].current&&refs[i+1].current.focus();
    if(d.every(x=>x))submit(d.join(""));
  }
  function bk(i,e){
    if(pinFrozen) return;
    if(e.key==="Backspace"&&!digits[i]&&i>0){
      refs[i-1].current&&refs[i-1].current.focus();
      const d=[...digits];d[i-1]="";setDigits(d);
    }
  }
  function submit(code){
    setLoad(true);
    setTimeout(()=>{
      if(code===String(userPin)){
        // Reset attempts on success
        setAttempts(0);
        onSuccess();
      } else {
        const newAttempts=attempts+1;
        setAttempts(newAttempts);
        setError(true);
        if(newAttempts>=MAX_ATTEMPTS){
          // IRON never blocks — flag HIGH_RISK instead of freezing
          if(user) freezeAccount(user,"3 incorrect PIN attempts — HIGH_RISK flag (non-blocking)",5);
          setErrMsg("3 wrong PINs — flagged HIGH_RISK. You may try again or proceed with OTP.");
          setAttempts(0); // reset so user can continue — never blocks
          // Do not set pinFrozen true (no 5-min block screen)
        } else {
          setErrMsg(`Incorrect PIN. ${MAX_ATTEMPTS-newAttempts} attempt${MAX_ATTEMPTS-newAttempts===1?"":"s"} left.`);
        }
        setTimeout(()=>{
          setError(false);
          setDigits(["","","",""]);
          refs[0].current&&refs[0].current.focus();
        },700);
      }
      setLoad(false);
    },600);
  }
  useEffect(()=>{

/* ═══ FRAUD RISK CARD with PIN+OTP for suspicious ═══ */
function FraudRiskCard({score, recipient, recipientNum, amount, signals, onVerify, onCancel, onReport, tier, avgAmount=0, historyCount=0, kwMatched=[], urgencyHits=[], urgencyScore=0}){
  const [countdown, setCountdown] = useState(15);
  const [timerActive, setTimerActive] = useState(false);

  useEffect(() => {
    if (score >= 90) {
      setCountdown(15);
      setTimerActive(true);
    } else {
      setTimerActive(false);
    }
  }, [score]);

  useEffect(() => {
    if (!timerActive) return;
    if (countdown <= 0) { setTimerActive(false); return; }
    const t = setTimeout(() => setCountdown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [timerActive, countdown]);

  const m=riskMeta(score);
  const R=36,cx=52,cy=52;
  const sa=Math.PI*.75,sw=Math.PI*1.5*(score/100);
  function p2r(a){return{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};}
  function arc(from,to){
    const f=p2r(from),t=p2r(to),lg=(to-from)>Math.PI?1:0;
    return`M ${f.x} ${f.y} A ${R} ${R} 0 ${lg} 1 ${t.x} ${t.y}`;
  }

  // Risk is guidance, not permission. Verification remains a separate
  // security step and the user always gets a continue option.
  const isNormal = tier === 'SAFE' || tier === 'safe' || tier === 'normal';
  const title = isNormal
    ? '🟢 Payment looks consistent with your usual activity'
    : '🟠 This payment looks unusual for you';
  const reasonList = [];
  let recipientReasonAdded = false;
  const addReason = reason => {
    const value = String(reason || "").replace(/\s+/g, " ").trim();
    if (value && !reasonList.includes(value)) reasonList.push(value);
  };
  (signals || []).forEach(raw => {
    const signal = raw && typeof raw === "object" ? raw : {id:"", description:String(raw || "")};
    const id = String(signal.id || "").toLowerCase();
    const text = String(signal.description || signal.user_message || "").trim();
    const evidence = signal.evidence || {};
    const amount = Number(evidence.amount);
    const percent = Number(evidence.percent || evidence.balance_drain_pct);
    if (id.includes("recipient") && (id.includes("new") || id.includes("unfamiliar")) ||
        /not previously paid|never sent money|not appeared in.*history|not seen in.*contact/i.test(text)) {
      if (!recipientReasonAdded) {
        addReason("You have not paid this recipient before.");
        recipientReasonAdded = true;
      }
    } else if (id.includes("recipient") && id.includes("report") || /reported|scam report/i.test(text)) {
      addReason(text || "This recipient has been reported by other users.");
    } else if (id.includes("balance") && (percent > 0 || /drain|balance/i.test(text))) {
      addReason(percent > 0
        ? `This payment would use about ${Math.round(percent > 1 ? percent : percent * 100)}% of your available balance.`
        : text);
    } else if (id !== "round_amount_large" &&
               (id.includes("amount") || id.includes("spike") || id.includes("behaviour") || id.includes("behavior") ||
               /unusually high|typical amount|usual spending|amount.*normal/i.test(text))) {
      const signalAverage = Number(evidence.avg_amount || evidence.mean || avgAmount || 0);
      const baselineText = signalAverage
        ? ` Your average payment is ₹${Math.round(signalAverage).toLocaleString("en-IN")}${historyCount ? ` across ${historyCount} payments` : ""}.`
        : "";
      addReason(text
        ? `${text}${/average|avg|typical|usual/i.test(text) ? "" : baselineText}`
        : (amount > 0
          ? `₹${amount.toLocaleString("en-IN")} compared with your average payment of ₹${Math.round(signalAverage).toLocaleString("en-IN")}.`
          : "The amount differs from your usual payment pattern."));
    } else if (id.includes("device") || /device/i.test(text)) {
      addReason("This payment is coming from a device you do not usually use.");
    } else if (id.includes("location") || /location|travel/i.test(text)) {
      addReason("This payment is coming from an unusual location.");
    } else if (id.includes("velocity") || /transactions? in \d+|short period|rapid/i.test(text)) {
      addReason(text || "Several payments were attempted in a short period.");
    } else if (id.includes("tim") || /hour|night|timing/i.test(text)) {
      addReason(text || "This payment is being attempted at an unusual time.");
    } else if (id.includes("urgency") || /urgent|immediately|emergency|hurry/i.test(text)) {
      addReason(text || "The payment request uses urgency language.");
    } else if (id === "round_amount_large" || /round.number/i.test(text)) {
      // A round amount alone is not an account-specific anomaly. Only show it
      // when the amount is also materially above this user's baseline.
      const baseline = Number(evidence.avg_amount || avgAmount || 0);
      if (!baseline || amount >= baseline * 2) {
        addReason(text || "The round-number amount matches patterns seen in scam requests.");
      }
    } else if (text) {
      // Preserve an evidence-backed explanation even when a new backend signal
      // has not yet received a dedicated consumer wording.
      addReason(text);
    }
  });
  const displayReasons = reasonList.slice(0, 5);
  const averageLabel = Number(avgAmount) > 0
    ? `₹${Math.round(avgAmount).toLocaleString("en-IN")}${historyCount ? ` across ${historyCount} payments` : ""}`
    : "";
  const amountContext = averageLabel
    ? Number(amount) > Number(avgAmount) * 1.5
      ? `₹${Number(amount).toLocaleString("en-IN")} is above your average payment of ${averageLabel}.`
      : `₹${Number(amount).toLocaleString("en-IN")} is within your usual range; your average payment is ${averageLabel}.`
    : "";

  return(
    <Card style={{padding:0,overflow:"hidden",border:`1.5px solid ${m.border}`}}>
      <div style={{height:4,background:`linear-gradient(90deg,${m.dot},${m.color})`,borderRadius:"18px 18px 0 0"}}/>
      <div style={{padding:"20px 22px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              {Ic.warn(m.dot)}
              <span style={{fontWeight:800,fontSize:15,color:m.color}}>
                {title}
              </span>
            </div>
            <p style={{fontSize:12,color:"#75777D"}}>{isNormal ? "This payment matches your usual activity." : "Please check the details before continuing."}</p>
          </div>
        </div>
        <div style={{background:"#FAFAF8",borderRadius:6,padding:"14px 16px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:13,color:"#45474D"}}>Sending to</span>
            <span style={{fontSize:13,fontWeight:700,color:"#1A1C1A"}}>{recipient}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,color:"#45474D"}}>Amount</span>
            <span style={{fontSize:19,fontWeight:800,color:"#1A1C1A"}}>₹{Number(amount).toLocaleString("en-IN")}</span>
          </div>
        </div>
        <div style={{marginBottom:14,padding:"10px 12px",background:"#FAFAF8",border:"1px solid #E0E1DD",borderRadius:6}}>
          <div style={{fontSize:11,fontWeight:800,color:"#75777D",textTransform:"uppercase",letterSpacing:.7,marginBottom:4}}>
            Review basis
          </div>
          <div style={{fontSize:12,color:"#45474D",lineHeight:1.45}}>
            Iron compared this payment with your usual spending pattern, recipient familiarity, recent activity, and account context.
            {amountContext && <div style={{marginTop:6,fontWeight:600}}>{amountContext}</div>}
          </div>
        </div>
        {!isNormal && displayReasons.length > 0 && (
          <div style={{marginBottom:14,padding:"12px 14px",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8}}>
            <div style={{fontSize:12,fontWeight:800,color:"#854D0E",marginBottom:7}}>Why this looks unusual</div>
            {displayReasons.map(reason => (
              <div key={reason} style={{fontSize:13,color:"#92400E",lineHeight:1.5,marginBottom:3}}>• {reason}</div>
            ))}
          </div>
        )}
        {/* ===== Network Fraud Intelligence — recipient report count ===== */}
        {recipientNum&&getRecipientRisk(recipientNum)>=1&&(
          <div style={{marginBottom:12}}>
            <div style={{padding:"10px 14px",background:"#fff9f9",border:"1px solid #fca5a5",
              borderRadius:4,display:"flex",alignItems:"center",gap:8,marginBottom:getRecipientRisk(recipientNum)>3?6:0}}>
              {Ic.warn("#dc2626")}
              <span style={{fontSize:13,color:"#ba1a1a",fontWeight:600}}>
                ⚠ Reported {getRecipientRisk(recipientNum)} time{getRecipientRisk(recipientNum)>1?"s":""} in our network
              </span>
            </div>
            {getRecipientRisk(recipientNum)>3&&(
              <div style={{padding:"8px 14px",background:"#450a0a",border:"1.5px solid #dc2626",
                borderRadius:4,display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14}}>🚨</span>
                <span style={{fontSize:13,color:"#fca5a5",fontWeight:700}}>
                  High-risk recipient — multiple users have flagged this account
                </span>
              </div>
            )}
          </div>
        )}

        {/* ===== ENGINE INSIGHTS + WHY IS THIS RISKY — clean 3-layer separation ===== */}
        <div style={{display:"none"}}>
        {(()=> {
          // Build explanation from getRiskExplanation (if user context available via recipientNum)
          // We also incorporate the existing signals[] for full engine detail
          // LAYER 1 — Engine Insights: full technical sentences from the fraud engine
          // LAYER 2 — Why is this risky?: short human reasons from getRiskExplanation
          // LAYER 3 — Tags: 1-2 word chips
          // No signal repeats across layers.

          // Collect all engine insight sentences (existing signals array, deduplicated) – normalize objects
          const normalizedSignals = (signals || []).map(s => typeof s === 'string' ? s : (s.description || s.id || String(s)));
          const engineInsights = normalizedSignals ? [...new Set(normalizedSignals)] : [];

          // Build explanation layers from recipientNum context
          const rr = recipientNum ? getRecipientRisk(recipientNum) : 0;
          const whyReasons = [];
          const whyTags    = [];

          // Network
          if (rr > 0) {
            whyReasons.push(`Reported by ${rr} user${rr > 1 ? "s" : ""}`);
            whyTags.push("Reported");
          }

          // Parse short reasons from signals — avoid duplicating what engine insights say
          if (normalizedSignals) {
            normalizedSignals.forEach(s => {
              const sl = (typeof s === 'string' ? s : (s.description || s.id || String(s))).toLowerCase();
              if ((sl.includes("new recipient") || sl.includes("not seen in your contacts")) &&
                  !whyReasons.some(r => r.toLowerCase().includes("new recipient"))) {
                whyReasons.push("New recipient");
                whyTags.push("New");
              }
              if ((sl.includes("drain") || sl.includes("large transfer") || sl.includes("higher than your usual") || sl.includes("unusually far outside")) &&
                  !whyReasons.some(r => r.toLowerCase().includes("amount") || r.toLowerCase().includes("spend"))) {
                whyReasons.push("High amount");
                if (!whyTags.includes("High Amount")) whyTags.push("High Amount");
              }
              if ((sl.includes("daily spending") || sl.includes("starting balance") || sl.includes("portion")) &&
                  !whyReasons.some(r => r.toLowerCase().includes("spend") || r.toLowerCase().includes("balance"))) {
                whyReasons.push("Large spend");
                if (!whyTags.includes("Large Spend")) whyTags.push("Large Spend");
              }
              if ((sl.includes("off-network") || sl.includes("outside the upi network") || sl.includes("outside the trusted")) &&
                  !whyReasons.some(r => r.toLowerCase().includes("off-network") || r.toLowerCase().includes("network"))) {
                whyReasons.push("Off-network account");
                if (!whyTags.includes("Off-Network")) whyTags.push("Off-Network");
              }
              if ((sl.includes("late-night") || sl.includes("odd hour") || sl.includes("unusual time") || sl.includes("1–5")) &&
                  !whyReasons.some(r => r.toLowerCase().includes("hour"))) {
                whyReasons.push("Odd hour");
                if (!whyTags.includes("Odd Hour")) whyTags.push("Odd Hour");
              }
            });
          }

          const dedupeReasons = [...new Set(whyReasons)];
          const dedupeTags    = [...new Set(whyTags)];

          const TAG_STYLE = (tag) => {
            const map = {
              "Reported":    {c:"#dc2626", bg:"#fef2f2", bd:"#fca5a5"},
              "New":         {c:"#f59e0b", bg:"#fef3c7", bd:"#fcd34d"},
              "High Amount": {c:"#f97316", bg:"#fff7ed", bd:"#fdba74"},
              "Large Spend": {c:"#ea580c", bg:"#fff7ed", bd:"#fb923c"},
              "Odd Hour":    {c:"#7c3aed", bg:"#f5f3ff", bd:"#c4b5fd"},
              "Off-Network": {c:"#0369a1", bg:"#e0f2fe", bd:"#7dd3fc"},
            };
            return map[tag] || {c:"#64748b", bg:"#f8faff", bd:"#e2e8f0"};
          };

          return (
            <>
              {/* SECTION 1: Engine Insights — full technical sentences */}
              {engineInsights.length > 0 && (
                <div style={{marginBottom:14}}>
                  <p style={{fontSize:11,fontWeight:800,color:"#75777D",textTransform:"uppercase",
                    letterSpacing:.8,marginBottom:8}}>
                    🔍 Engine Insights
                  </p>
                  {engineInsights.slice(0,6).map((s,i)=>{
                    const isKW = s.startsWith("⚠️") || s.startsWith("🚨");
                    return(
                      <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:6,
                        padding:"7px 10px",
                        background:isKW?"#fff7ed":m.bg,
                        borderRadius:8,border:`1px solid ${isKW?"#fdba74":m.border}`,
                        animation:`slideInL .2s ${i*.06}s ease both`}}>
                        <svg width="6"height="6"style={{flexShrink:0,marginTop:5}}>
                          <circle cx="3"cy="3"r="3"fill={isKW?"#f59e0b":m.dot}/>
                        </svg>
                        <span style={{fontSize:13,color:isKW?"#92400e":m.color,
                          fontWeight:isKW?600:500,lineHeight:1.4}}>{s}</span>
                      </div>
                    );
                  })}

                  {/* Urgency Detection — kept inside Engine Insights, no duplication */}
                  {urgencyHits.length>0&&(
                    <div style={{marginTop:8,padding:"10px 14px",background:"#fff7ed",
                      border:"1.5px solid #f97316",borderRadius:4,
                      display:"flex",alignItems:"flex-start",gap:10,
                      animation:"slideInL .25s ease both"}}>
                      <span style={{fontSize:18,flexShrink:0}}>⚡</span>
                      <div>
                        <p style={{fontSize:13,fontWeight:700,color:"#9a3412",marginBottom:4,lineHeight:1.4}}>
                          ⚠️ This request uses urgency tactics often seen in scams
                        </p>
                        <p style={{fontSize:11,color:"#92400e",fontWeight:500,lineHeight:1.4,margin:0}}>
                          Detected: {urgencyHits.slice(0,4).map(h=>`"${h}"`).join(", ")}
                          {urgencyHits.length>4?` +${urgencyHits.length-4} more`:""}
                          {" "}— Scammers often create false urgency to bypass your judgement.
                        </p>
                      </div>
                    </div>
                  )}

                  {/* UPI Keyword badges — kept inside Engine Insights */}
                  {kwMatched.length>0&&(
                    <div style={{marginTop:10,padding:"10px 12px",
                      background:kwMatched.some(k=>k.tier==="critical")?"#fff1f2":"#fff7ed",
                      borderRadius:4,
                      border:kwMatched.some(k=>k.tier==="critical")?"1px solid #fda4af":"1px solid #fdba74"}}>
                      <p style={{fontSize:10,fontWeight:800,
                        color:kwMatched.some(k=>k.tier==="critical")?"#881337":"#92400e",
                        textTransform:"uppercase",letterSpacing:.7,marginBottom:7}}>
                        🔍 Flagged UPI Keywords
                      </p>
                      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                        {kwMatched.map((kw,i)=>{
                          const chipColor=kw.tier==="critical"?"#9f1239":kw.tier==="high"?"#dc2626":kw.tier==="medium"?"#f97316":"#f59e0b";
                          const chipBg=kw.tier==="critical"?"#fff1f2":kw.tier==="high"?"#fef2f2":kw.tier==="medium"?"#fff7ed":"#fefce8";
                          const chipBord=kw.tier==="critical"?"#fda4af":kw.tier==="high"?"#fca5a5":kw.tier==="medium"?"#fdba74":"#fde68a";
                          const tierLabel=kw.tier==="critical"?"🚨 CRIT":kw.tier==="high"?"HIGH":kw.tier==="medium"?"MED":"LOW";
                          return(
                            <span key={i} title={kw.desc} style={{display:"inline-flex",alignItems:"center",gap:4,
                              padding:"3px 10px",borderRadius:6,fontSize:12,fontWeight:700,
                              background:chipBg,color:chipColor,border:`1.5px solid ${chipBord}`}}>
                              <svg width="7"height="7"><circle cx="3.5"cy="3.5"r="3.5"fill={chipColor}/></svg>
                              {kw.canonical}
                              <span style={{fontSize:10,opacity:.75,fontWeight:600}}>{tierLabel}</span>
                            </span>
                          );
                        })}
                      </div>
                      <p style={{fontSize:10,color:"#75777D",marginTop:7,lineHeight:1.4}}>
                        Hover a badge for scam description · Keywords are weighted by fraud frequency
                      </p>
                    </div>
                  )}
                </div>
              )}

              {/* SECTION 2: Why is this risky? — short human reasons only */}
              {dedupeReasons.length > 0 && score >= 60 && (
                <div style={{marginBottom:14,padding:"12px 14px",background:"#fff7ed",
                  border:"1.5px solid #fdba74",borderRadius:6,animation:"slideInL .3s ease both"}}>
                  <p style={{fontSize:11,fontWeight:800,color:"#92400e",textTransform:"uppercase",
                    letterSpacing:.7,marginBottom:8}}>
                    🤔 Why is this risky?
                  </p>
                  {dedupeReasons.map((r,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"flex-start",gap:7,marginBottom:5,
                      fontSize:13,color:"#9a3412",fontWeight:600,lineHeight:1.4}}>
                      <span style={{flexShrink:0,marginTop:1}}>⚠</span><span>{r}</span>
                    </div>
                  ))}

                  {/* SECTION 3: Tag chips — 1-2 word labels only */}
                  {dedupeTags.length > 0 && (
                    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:10}}>
                      {dedupeTags.map((tag,i)=>{
                        const ts = TAG_STYLE(tag);
                        return(
                          <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4,
                            padding:"3px 10px",borderRadius:8,fontSize:11,fontWeight:700,
                            background:ts.bg,color:ts.c,border:`1.5px solid ${ts.bd}`}}>
                            {tag}
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </>
          );
        })()}
        </div>


        {/* ===== 90+ WARNING: Extra caution text above button ===== */}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onVerify} className="btn-primary"
            style={{flex:1,padding:"12px",background:`linear-gradient(135deg,#1B263B,#0F1E2E)`,border:"none",
              borderRadius:6,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",

      </div>
    </Card>
  );
}

/* ═══ COOLDOWN MODAL with working timer ═══ */
function CooldownModal({remaining, reason, onClose}){
  const [seconds, setSeconds] = useState(remaining);
  
  useEffect(() => {
    if (seconds <= 0) {
      onClose();
      return;
    }
    const timer = setInterval(() => setSeconds(s => s - 1), 1000);
    return () => clearInterval(timer);
  }, [seconds, onClose]);
  
  useEffect(() => {
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = ""; };
  }, []);
  
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  
  return (
    <Modal>
      <div style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",zIndex:9999,
        background:"rgba(10,25,70,.65)",backdropFilter:"blur(8px)",
        display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:8,maxWidth:380,padding:"30px",textAlign:"center"}}>
          <div style={{width:70,height:70,borderRadius:"50%",background:"#fff9f9",
            display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
            {Ic.warn("#dc2626")}
          </div>
          <h3 style={{fontSize:20,fontWeight:800,color:"#1A1C1A",marginBottom:8}}>Unusual Activity Detected</h3>
          <p style={{color:"#45474D",marginBottom:16}}>{reason || "Too many rapid small payments detected."}</p>
          <div style={{fontSize:48,fontWeight:800,color:"#C5A059",marginBottom:16,fontFamily:"monospace"}}>
            {mins}:{secs.toString().padStart(2,'0')}
          </div>
          <div style={{width:"100%",height:4,background:"#FDFCFB",borderRadius:2,marginBottom:16}}>
            <div style={{height:"100%",width:`${(seconds/remaining)*100}%`,background:"#1B263B",
              borderRadius:2,transition:"width 1s linear"}}/>
          </div>
          <p style={{fontSize:13,color:"#75777D"}}>Please wait before your next transaction</p>
        </div>
      </div>
    </Modal>
  );
}

/* ═══ FREEZE MODAL with working timer ═══ */
function FreezeModal({message, permanent, remaining, onClose}){
  const [seconds, setSeconds] = useState(remaining || 0);
  
  useEffect(() => {
    if (permanent || seconds <= 0) return;
    
    const timer = setInterval(() => {
      setSeconds(s => {
        if (s <= 1) {
          onClose();
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [seconds, permanent, onClose]);
  
  useEffect(() => {
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = ""; };
  }, []);
  
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  
  return (
    <Modal>
      <div style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",zIndex:9999,
        background:"rgba(10,25,70,.65)",backdropFilter:"blur(8px)",
        display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:8,maxWidth:380,padding:"30px",textAlign:"center"}}>
          <div style={{width:70,height:70,borderRadius:"50%",background:permanent?"#fef2f2":"#fff7ed",
            display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
            {Ic.freeze(permanent?"#dc2626":"#f97316")}
          </div>
          <h3 style={{fontSize:20,fontWeight:800,color:permanent?"#dc2626":"#f97316",marginBottom:8}}>
            {permanent ? "Account Locked" : "Account Paused"}
          </h3>
          <p style={{color:"#45474D",marginBottom:16}}>{message}</p>
          {!permanent && seconds > 0 && (
            <>
              <div style={{fontSize:36,fontWeight:800,color:"#C5A059",marginBottom:16,fontFamily:"monospace"}}>
                {mins}:{secs.toString().padStart(2,'0')}
              </div>
              <div style={{width:"100%",height:4,background:"#FDFCFB",borderRadius:2,marginBottom:16}}>
                <div style={{height:"100%",width:`${(seconds/(remaining||1))*100}%`,background:"#1B263B",
                  borderRadius:2,transition:"width 1s linear"}}/>
              </div>
            </>
          )}
          <button onClick={onClose}
            style={{width:"100%",padding:"12px",background:permanent?"#f1f5f9":"#C5A059",
              border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",
              color:permanent?"#0f172a":"#fff"}}>
            {permanent ? "Contact Support" : "OK"}
          </button>
        </div>
      </div>
    </Modal>
  );
}

/* ═══ RECIPIENT RISK WARNING COMPONENT — Network-Level Reporting UI ═══ */
function RecipientRiskWarning({recipient, recipientType, userContacts, amount, userObj}){
  const[showWhy, setShowWhy] = useState(false);
  if(!recipient) return null;
  const targetNum = recipientType==='phone' ? recipient
    : (Object.entries(USERS).find(([,v])=>v.upi===recipient)||[])[0] || recipient;
  const rr = getRecipientRisk(targetNum);
  if(rr < 1) return null;

  const isHighRisk = rr > 3;
  const isNewRecipient = !(targetNum in (userContacts||{}));
  const inNetwork = targetNum in USERS;

  // Build explanation using getRiskExplanation if we have user context
  const expl = userObj && amount > 0
    ? getRiskExplanation(userObj, targetNum, amount)
    : null;

  const reasons = [];
  reasons.push(`Reported by ${rr} user${rr!==1?"s":""}`);
  if(isNewRecipient) reasons.push("New recipient — not in your contacts");
  if(!inNetwork) reasons.push("Unknown / off-network account");
  if(expl && expl.reasons.length > 0) {
    expl.reasons.forEach(r => { if(!reasons.some(x=>x.toLowerCase().includes(r.toLowerCase().slice(0,12)))) reasons.push(r); });
  }

  const tags = [];
  tags.push("Reported");
  if(isNewRecipient) tags.push("New Recipient");
  if(!inNetwork) tags.push("Off-Network");

  return(
    <div style={{marginTop:10,animation:"slideDown .25s ease"}}>
      {/* Primary banner */}
      <div style={{padding:"10px 14px",
        background: isHighRisk ? "#450a0a" : "#fef2f2",
        border:`1.5px solid ${isHighRisk?"#dc2626":"#fca5a5"}`,
        borderRadius: showWhy ? "12px 12px 0 0" : 12,
        display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:15,flexShrink:0}}>{isHighRisk?"🚨":"⚠"}</span>
        <span style={{fontSize:13,fontWeight:700,color:isHighRisk?"#fca5a5":"#dc2626",flex:1}}>
          {isHighRisk
            ? `🚨 High-risk recipient — reported ${rr} times`
            : `⚠ Reported ${rr} time${rr!==1?"s":""} in network`}
        </span>
        <button onClick={()=>setShowWhy(w=>!w)}
          style={{background:"none",border:"none",cursor:"pointer",fontSize:11,
            color:isHighRisk?"#fca5a5":"#C5A059",fontWeight:700,
            fontFamily:"'Inter',sans-serif",padding:0,whiteSpace:"nowrap"}}>
          {showWhy?"Hide ▲":"Details ▼"}
        </button>
      </div>

      {/* Expandable detail panel */}
      {showWhy && (
        <div style={{padding:"12px 14px",background:"#fff7ed",
          border:"1.5px solid #fdba74",borderTop:"none",
          borderRadius:"0 0 12px 12px"}}>
          <div style={{fontSize:11,fontWeight:800,color:"#92400e",
            textTransform:"uppercase",letterSpacing:.6,marginBottom:8}}>
            🤔 Why is this risky?
          </div>
          {reasons.map((r,i)=>(
            <div key={i} style={{display:"flex",alignItems:"flex-start",gap:6,
              marginBottom:5,fontSize:12,color:"#92400e",fontWeight:600,lineHeight:1.4}}>
              <span style={{flexShrink:0}}>⚠</span><span>{r}</span>
            </div>
          ))}
          {/* Tag chips */}
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8}}>
            {tags.map((tag,i)=>{
              const tc=tag==="Reported"?"#dc2626":tag==="New Recipient"?"#f59e0b":"#64748b";
              const tbg=tag==="Reported"?"#fef2f2":tag==="New Recipient"?"#fef3c7":"#f8faff";
              const tbd=tag==="Reported"?"#fca5a5":tag==="New Recipient"?"#fcd34d":"#e2e8f0";
              return(
                <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4,
                  padding:"3px 10px",borderRadius:8,fontSize:11,fontWeight:700,
                  background:tbg,color:tc,border:`1.5px solid ${tbd}`}}>
                  {tag}
                </span>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ LIVE ML HELPER — calls backend Isolation Forest + Fraud Intelligence Layer === */
async function fetchLiveMLScore(user, amount, targetNum, resolvedUPI, note, balanceVal){
  const base = typeof API !== "undefined" ? API : "";
  const now = new Date();
  const hour = now.getHours();
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dayName = days[now.getDay()];
  const isWeekend = (now.getDay()===0||now.getDay()===6)?1:0;
  const recent5 = typeof getRecentTransactions!=="undefined"?getRecentTransactions(user,5):[];
  const recent60 = typeof getRecentTransactions!=="undefined"?getRecentTransactions(user,60):[];
  const recent1440 = typeof getRecentTransactions!=="undefined"?getRecentTransactions(user,1440):[];
  const uniq30 = typeof getRecentTransactions!=="undefined"?new Set(getRecentTransactions(user,30).map(t=>t.toNum||t.fromNum)).size:1;
  const recentAmounts = (user.transactions||[]).slice(0,5).map(t=>t.amt);
  let urgencyScore=0;
  try{ const u=detectUrgency(note, resolvedUPI||""); urgencyScore=u.urgencyScore||0; }catch{}
  const txn = {
    user_id: user.number,
    amount: amount,
    hour_of_day: hour,
    day_of_week: dayName,
    is_weekend: isWeekend,
    is_salary_period: (now.getDate()<=5?1:0),
    merchant_name: resolvedUPI||targetNum||"unknown",
    merchant_category: "Transfer",
    recipient_type: "individual",
    payment_method: "UPI",
    device_familiarity: (typeof GeoDeviceBaseline!=="undefined" && GeoDeviceBaseline.isNewDevice)?0.2:1.0,
    location_familiarity: (typeof GeoDeviceBaseline!=="undefined" && GeoDeviceBaseline.location_enabled)?1.0:0.3,
    balance_before: balanceVal!=null?balanceVal:user.balance,
    account_age_days: 365,
    recipient_frequency_score: (user.known_recipients?.has(targetNum)||(user.contacts||{})[targetNum])?1.0:0.0,
    days_since_recipient_seen: (user.known_recipients?.has(targetNum)?0:999),
    merchant_frequency_score: 0.5,
    recipient_report_count: (typeof getRecipientRisk!=="undefined"?getRecipientRisk(targetNum):0),
    is_off_network: !(targetNum in USERS),
    urgency_score: urgencyScore,
    note: note||"",
    txn_velocity_1h: recent60.length+1,
    txn_velocity_5m: recent5.length+1,
    txn_velocity_24h: recent1440.length+1,
    unique_recipients_30m: uniq30||1,
    amount_velocity_24h: recent1440.reduce((s,t)=>s+t.amt,0)+amount,
    recent_amounts: recentAmounts,
    daily_spend_today: (typeof getDailySpent!=="undefined"?getDailySpent(user):0)
  };
  const profile = {
    user_id: user.number,
    avg_amount: (typeof calculateAvgTransaction!=="undefined"?calculateAvgTransaction(user):1000),
    daily_avg_spend: Math.max((typeof getDailySpent!=="undefined"?getDailySpent(user)*2:3000), 3000)
  };
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 4500);
  try{
    // Phase 1D: authoritative risk via POST /risk/assess (SAFE/CAUTION/HIGH_RISK)
    const res = await fetch(`${base}/risk/assess`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({transaction:txn, user_profile:profile}), signal: ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error("risk backend "+res.status);
    const data = await res.json();
    // Prefer new iron tier fields, fallback to analyze shape
    const score = data.score ?? data.final?.score ?? 50;
    const tier = data.tier ?? data.final?.iron_tier ?? (score>=85?"HIGH_RISK":score>=70?"CAUTION":"SAFE");
    return {
      fallback:false,
      behavior_score: data.stage1?.behavior_score ?? 50,
      fraud_score: data.stage2?.fraud_score ?? 50,
      final_score: score,
      risk_level: tier,
      iron_tier: tier,
      patterns: data.stage2?.matched_patterns || data.signals || [],
      pattern_details: data.stage2?.pattern_details || [],
      requires_otp: data.requires_otp ?? data.final?.requires_otp ?? false,
      confidence: data.confidence ?? data.stage2?.confidence ?? 0,
      signals: data.signals || [],
      explanation: data.explanation || ""
    };
  }catch(e){
    clearTimeout(timer);
    console.warn("[IronWallet ML] live backend unavailable, using local fallback:", e.message||e);
    return {fallback:true};
  }
}

  const[recentTxTimestamps, setRecentTxTimestamps] = useState(()=>{

  }); // [{toNum, amt, ts}]

  const[showDupWarning, setShowDupWarning] = useState(false);

  useEffect(() => { recordInteraction(user.number, 'page_load'); }, [user.number]);

    const cooldown = checkCooldown(user);

      setShowCooldown(true);
    }
  }, [user]);

  const parsedAmt = parseFloat(amt)||0;

    if (!recipient) return { name: "", targetNum: "", inUPI: false, inContacts: false, inHistory: false };

    if (recipientType === 'upi') {
      const u = Object.entries(USERS).find(([,v]) => v.upi === recipient);
      if (u) targetNum = u[0];
    }
    const inUPI = targetNum in USERS;
    const inContacts = targetNum in (user.contacts || {});
    const inHistory = user.known_recipients?.has(targetNum) || false;
    const name = inUPI ? USERS[targetNum].name : (inContacts ? user.contacts[targetNum] : recipient);
    return { name, targetNum, inUPI, inContacts, inHistory };
  };

  const isFormReady = recipient && amt && parsedAmt>0 && !isInsufficient && (recipientType==="upi" || recipient.replace(/\D/,"").length===10);

  // Phase 1I: live scam reputation — fetch network risk on recipient change (debounced)
  useEffect(()=>{
    const { targetNum } = getRecipientInfo();
    if(!targetNum) return;
    const h = setTimeout(()=>{ try{ if(typeof checkRecipientNetworkRisk==="function") checkRecipientNetworkRisk(targetNum); }catch{} }, 400);
    return ()=>clearTimeout(h);
  }, [recipient, recipientType]);

    setAmt(v);
    setBalErr("");
  }

  // ===== FEATURE: Duplicate Payment Warning handlers — now live ML wired ====
  async function handleDupWarningProceed() {
    setShowDupWarning(false);
    bypassDuplicateRef.current = true;
    return analyzeRisk();
    setShowDupWarning(false);
    const { targetNum } = getRecipientInfo();
    setRecentTxTimestamps(prev => [...prev, { toNum: targetNum || recipient, amt: parsedAmt, ts: Date.now() }]);
    const { targetNum: tn } = getRecipientInfo();
    setStage("analyzing");
    setProg(0);
    const t = setInterval(() => setProg(p => { if(p>=92){ clearInterval(t); return 92; } return p + 7; }), 80);
    setTimeout(async () => {
      clearInterval(t); setProg(100);
      // RiskEngine is the only risk authority. Local heuristics are not
      // allowed to decide whether this payment is normal or unusual.
      try {
        const hdr = getAuthHeader();
        if (!hdr.Authorization) throw new Error("Authentication is required to prepare a payment.");
        const geo = typeof getTxGeoDeviceMeta === "function" ? getTxGeoDeviceMeta() : {};
        const prepRes = await fetch(`${API}/transactions/prepare`, {
          method: "POST",
          headers: {...hdr, "Content-Type": "application/json"},
          body: JSON.stringify({
            recipient: tn || recipient,
            amount: parsedAmt,
            note: note || "",
            device_familiarity: geo.isNewDevice ? 0 : 1,
            location_familiarity: typeof GeoDeviceBaseline !== "undefined" && GeoDeviceBaseline.location_enabled ? 1 : 1,
            hour_of_day: new Date().getHours()
          })
        });
        const prepData = await prepRes.json().catch(() => ({}));
        if (!prepRes.ok || !prepData.transaction_id || !prepData.risk) {
          throw new Error(prepData.error || prepData.detail || "Payment risk assessment failed.");
        }
        const risk = prepData.risk;
        const backendTier = risk.tier === "HIGH_RISK" ? "high_risk" : risk.tier === "CAUTION" ? "caution" : "normal";
        // Keep the structured backend signals so the review card can explain
        // the actual evidence instead of reducing every case to fixed labels.
        const signals = risk.signals || [];
        setRiskData({
          score: risk.score,
          signals,
          action: "continue",
          tier: backendTier,
          risk: risk.score,
          transaction_id: prepData.transaction_id,
          preparedId: prepData.transaction_id,
          authoritative: true,
          requires_otp: !!risk.requires_otp,
          backendRisk: risk,
          explanation: risk.explanation || "",
          explanation_detail: risk.explanation_detail || null,
          components: risk.components || null
        });
        setStage(risk.tier === "SAFE" ? "pin" : "risk");
        return;
      } catch (e) {
        console.error("[IRON] authoritative payment preparation failed:", e);
        setBalErr(e.message || "Unable to assess this payment.");
        setStage("form");
        return;
      }

      const ruleResult = calculateRisk(user, parsedAmt, tn || recipient);
      if (ruleResult.action === 'cooldown') {
        const cd = applyCooldown(user, ruleResult.signals[0]);
        setCooldownData(cd); setShowCooldown(true); setStage("form"); return;
      }
      // Live ML (IF+FIL) with fallback to local JS scorer
      let mlSignals=[], mlAdj=0;
      const resolvedUPI = tn && USERS[tn] ? USERS[tn].upi : null;
      try{
        const live = await fetchLiveMLScore(user, parsedAmt, tn||recipient, resolvedUPI, note, balance);
        if(live && !live.fallback){
          if(live.fraud_score>80){ mlSignals.push(`🧠 Live ML (IF:${live.behavior_score} FIL:${live.fraud_score}) — ${live.patterns.slice(0,2).join(", ")||"anomaly detected"}`); mlAdj=Math.round(live.fraud_score*0.28); }
          else if(live.fraud_score>50){ mlSignals.push(`🧠 Live ML flagged: FIL ${live.fraud_score}/100 (IF ${live.behavior_score})`); mlAdj=Math.round(live.fraud_score*0.20); }
          else if(live.fraud_score<15 && live.behavior_score<15){ mlAdj=-8; }
          if(live.behavior_score>85) mlSignals.push(`Live IF anomaly: ${live.behavior_score}/100 behavioral deviation`);
          console.log("[IronWallet ML] live dup-check:", live);
        } else throw new Error("fallback");
      }catch(e){
        const mlProb = mlFraudScore(user, parsedAmt, tn || recipient);
        if (mlProb !== null) {
          if (mlProb > 0.80) { mlSignals.push("🧠 ML model: " + Math.round(mlProb*100) + "% fraud probability."); mlAdj = Math.round(mlProb * 25); }
          else if (mlProb > 0.50) { mlSignals.push("🧠 ML model flagged: " + Math.round(mlProb*100) + "% fraud probability."); mlAdj = Math.round(mlProb * 18); }
          else if (mlProb < 0.15) { mlAdj = -8; }
        }
      }
      const baseRisk = ruleResult.risk!=null?ruleResult.risk:(ruleResult.score||0);
      const score = Math.min(100, Math.max(0, (user.risk_score||0) + baseRisk + mlAdj));
      // Phase 1E centralized tiers
      const tierRaw = (typeof ironTier!=='undefined'? ironTier(score) : (score>=85?'HIGH_RISK':score>=70?'CAUTION':'SAFE'));
      // Map to legacy UI tier strings done above
      const tier = tierRaw==='HIGH_RISK' ? 'high_risk' : tierRaw==='CAUTION' ? 'caution' : 'normal';
      const action = tier === 'high_risk' ? 'high_risk' : tier === 'caution' ? 'caution' : 'allow'; // Phase 1A no block
      setRiskData({ score, signals: [...ruleResult.signals, ...mlSignals], action, tier, risk: baseRisk });
      setStage("risk");
    }, 600);
  }

  async function analyzeRisk(){
    // Phase 2D: use backend prepare for authoritative risk
    // Keep local fallback if backend unreachable
    console.log("[IronWallet] analyzeRisk invoked, stage=", stage, "isFormReady=", isFormReady);
    try {
    if(!isFormReady) {
      // Build a specific reason instead of dumping raw state into an alert.
      const reasons = [];
      if (!recipient) reasons.push("enter a recipient");
      if (!amt) reasons.push("enter an amount");
      if (parsedAmt <= 0) reasons.push("amount must be greater than 0");
      else if (isInsufficient) reasons.push("amount exceeds your balance");
      if (recipient && recipientType === "phone" && recipient.replace(/\D/g, "").length !== 10)
        reasons.push("phone number must be 10 digits");
      setBalErr(reasons.length ? `Please ${reasons.join(", ")}.` : "");
      return;
    }
    if(parsedAmt>balance){
      setBalErr(`Insufficient balance. You have ₹${balance.toLocaleString("en-IN")} available.`);
      return;
    }

    const { targetNum } = getRecipientInfo();
    if (!targetNum && recipientType === 'phone') {
      setBalErr("Invalid recipient number");
      return;
    }

    // ===== FEATURE: Duplicate Payment Warning — check same amount + same recipient within 3 minutes =====
    const FOUR_MINS = 4 * 60 * 1000;
    const now = Date.now();
    const recentDuplicate = recentTxTimestamps.some(tx => tx.toNum === (targetNum || recipient) && tx.amt === parsedAmt && (now - tx.ts) < FOUR_MINS);
    if (recentDuplicate && !bypassDuplicateRef.current) {
      setShowDupWarning(true); // show warning modal, don't proceed
      return;
    }
    bypassDuplicateRef.current = false;

    setStage("analyzing");
    setProg(0);
    
    const t = setInterval(() => setProg(p => {
      if(p>=92){ clearInterval(t); return 92; }
      return p + 7;
    }), 80);
    setTimeout(async () => {
      clearInterval(t); setProg(100);
      // RiskEngine is the only risk authority. Local heuristics are not
      // allowed to decide whether this payment is normal or unusual.
      try {
        const hdr = getAuthHeader();
        if (!hdr.Authorization) throw new Error("Authentication is required to prepare a payment.");
        const geo = typeof getTxGeoDeviceMeta === "function" ? getTxGeoDeviceMeta() : {};
        const prepRes = await fetch(`${API}/transactions/prepare`, {
          method: "POST",
          headers: {...hdr, "Content-Type": "application/json"},
          body: JSON.stringify({
            recipient: targetNum || recipient,
            amount: parsedAmt,
            note: note || "",
            device_familiarity: geo.isNewDevice ? 0 : 1,
            location_familiarity: 1,
            hour_of_day: new Date().getHours()
          })
        });
        const prepData = await prepRes.json().catch(() => ({}));
        if (!prepRes.ok || !prepData.transaction_id || !prepData.risk) {
          throw new Error(prepData.error || prepData.detail || "Payment risk assessment failed.");
        }
        const risk = prepData.risk;
        const tier = risk.tier === "HIGH_RISK" ? "high_risk" : risk.tier === "CAUTION" ? "caution" : "normal";
        const signals = (risk.signals || []).map(s => typeof s === "string" ? s : (s.description || s.id || String(s)));
        setRiskData({
          score: risk.score,
          signals,
          action: "continue",
          tier,
          risk: risk.score,
          transaction_id: prepData.transaction_id,
          preparedId: prepData.transaction_id,
          authoritative: true,
          requires_otp: !!risk.requires_otp,
          backendRisk: risk,
          explanation: risk.explanation || "",
          explanation_detail: risk.explanation_detail || null,
          components: risk.components || null
        });
        setStage(risk.tier === "SAFE" ? "pin" : "risk");
        return;
      } catch (e) {
        console.error("[IRON] authoritative payment preparation failed:", e);
        setBalErr(e.message || "Unable to assess this payment.");
        setStage("form");
        return;
      }

      const ruleResult = calculateRisk(user, parsedAmt, targetNum || recipient);
      console.log("[IronWallet] analysis done, ruleResult=", ruleResult);
      if (ruleResult.action === 'cooldown') {
        const cd = applyCooldown(user, ruleResult.signals[0]);
        setCooldownData(cd); setShowCooldown(true); setStage("form"); return;
      }
      // Live ML (Isolation Forest + FIL via POST /analyze) — falls back to local JS scorer if backend unreachable
      let mlSignals=[], mlAdj=0;
      const resolvedUPI2 = targetNum && USERS[targetNum] ? USERS[targetNum].upi : null;
      try{
        const live = await fetchLiveMLScore(user, parsedAmt, targetNum||recipient, resolvedUPI2, note, balance);
        if(live && !live.fallback){
          if(live.fraud_score>80){ mlSignals.push(`🧠 Live ML (IF:${live.behavior_score} FIL:${live.fraud_score}) — ${live.patterns.slice(0,2).join(", ")||"anomaly detected"}`); mlAdj=Math.round(live.fraud_score*0.28); }
          else if(live.fraud_score>50){ mlSignals.push(`🧠 Live ML flagged: FIL ${live.fraud_score}/100 (IF ${live.behavior_score})`); mlAdj=Math.round(live.fraud_score*0.20); }
          else if(live.fraud_score<15 && live.behavior_score<15){ mlAdj=-8; }
          if(live.behavior_score>85) mlSignals.push(`Live IF anomaly: ${live.behavior_score}/100 behavioral deviation`);
          console.log("[IronWallet ML] live:", live);
        } else throw new Error("fallback");
      }catch(e){
        const mlProb = mlFraudScore(user, parsedAmt, targetNum || recipient);
        if (mlProb !== null) {
          if (mlProb > 0.80) {
            mlSignals.push("🧠 ML model: " + Math.round(mlProb*100) + "% fraud probability.");
            mlAdj = Math.round(mlProb * 25);
          } else if (mlProb > 0.50) {
            mlSignals.push("🧠 ML model flagged: " + Math.round(mlProb*100) + "% fraud probability.");
            mlAdj = Math.round(mlProb * 18);
          } else if (mlProb < 0.15) {
            mlAdj = -8;
          }
        }
      }
      // Keyword Risk Analysis Engine — runs on UPI input
      let kwScore = 0, kwSignals = [], kwMatched = [];
      if (recipientType === 'upi' && recipient) {
        const kwResult = analyzeUPIKeywords(recipient);
        kwScore   = kwResult.keywordScore;
        kwSignals = kwResult.signals;
        kwMatched = kwResult.matchedKeywords;
      }
      // If resolved by phone the recipient UPI is available too
      const resolvedUPI = targetNum && USERS[targetNum] ? USERS[targetNum].upi : null;
      if (recipientType === 'phone' && resolvedUPI && kwScore === 0) {
        const kwResult = analyzeUPIKeywords(resolvedUPI);
        kwScore   = kwResult.keywordScore;
        kwSignals = kwResult.signals;
        kwMatched = kwResult.matchedKeywords;
      }

      // === Urgency Detection Feature ===
      // Run urgency scan on both payment note and recipient UPI ID.
      // The resolved UPI (if phone mode) is used as fallback.
      const urgencyUPI = recipientType === 'upi' ? recipient : (resolvedUPI || '');
      const urgencyResult = detectUrgency(note, urgencyUPI);
      // Blend urgency score: small weight (+0.08) nudges risk without dominating
      const urgencyAdj = Math.round(urgencyResult.urgencyScore * 8); // max +8 pts
      // === End Urgency Detection Feature ===

      // === Geo/Device Risk Integration ===
      // Wire dead code checkGeoDeviceRisk into live scoring
      const geoDeviceRisk = checkGeoDeviceRisk();
      const geoAdj = Math.min(geoDeviceRisk.risk, 15); // cap 15 to avoid dominating
      const geoSignals = geoDeviceRisk.signals || [];
      // === End Geo/Device Integration ===

      // Phase 1D: backend authoritative — if live risk available, use it directly; else fallback to local calc
      let totalRisk, tier, allSignals, backendTier;
      let authoritative = false;
      // live variable is mlSignals/mlAdj scope — check if live was successful (mlSignals from live)
      const hasLive = typeof live !== "undefined" && live && !live.fallback && live.final_score != null;
      if (hasLive) {
        totalRisk = Math.min(100, Math.max(0, live.final_score));
        backendTier = live.iron_tier || (totalRisk>=85?"HIGH_RISK":totalRisk>=70?"CAUTION":"SAFE");
        // Map backend iron tier to frontend tier strings used by UI
        tier = backendTier==="HIGH_RISK" ? "high_risk" : backendTier==="CAUTION" ? "caution" : "normal";
        authoritative = true;
        console.log("[IRON] authoritative risk from backend:", live, "tier:", tier);
      } else {
        totalRisk = Math.min(100, Math.max(0, user.risk_score + ruleResult.risk + mlAdj + kwScore + urgencyAdj + geoAdj));
        console.log("[IronWallet] totalRisk (fallback)=", totalRisk, "tier will be=", totalRisk >= 85 ? 'high_risk' : totalRisk >= 70 ? 'caution' : 'normal', "user.risk_score=", user.risk_score, "ruleResult.risk=", ruleResult.risk, "mlAdj=", mlAdj, "kwScore=", kwScore, "urgencyAdj=", urgencyAdj, "geoAdj=", geoAdj);
        backendTier = totalRisk>=85 ? "HIGH_RISK" : totalRisk>=70 ? "CAUTION" : "SAFE";
        tier = backendTier==="HIGH_RISK" ? "high_risk" : backendTier==="CAUTION" ? "caution" : "normal";
      }
      console.log("[IronWallet] totalRisk=", totalRisk, "tier will be=", totalRisk >= 70 ? 'otp' : totalRisk >= RISK_INFO ? 'info' : 'normal', "user.risk_score=", user.risk_score, "ruleResult.risk=", ruleResult.risk, "mlAdj=", mlAdj, "kwScore=", kwScore, "urgencyAdj=", urgencyAdj, "geoAdj=", geoAdj);
      // tier already set via authoritative backend above

      // ── Signal deduplication: keep ONLY the single most severe amount-based signal ──
      // Patterns cover: calculateRisk balance-drain, behaviouralDeviation z-score,
      // scamPatternCheck large-amount, and checkHighValueTransaction outputs.
      // === Urgency Detection Feature ===
      // If urgency keywords were found, append warning signal into the insight list
      const urgencySignals = urgencyResult.urgencyScore > 0
        ? ["⚠️ This request uses urgency tactics often seen in scams — take a moment to verify"]
        : [];
      // === End Urgency Detection Feature ===

      allSignals = [...ruleResult.signals, ...mlSignals, ...kwSignals, ...urgencySignals, ...geoSignals];
      const amountSignalPriority = [
        /This transaction drains \d+% of your balance/i,
        /Large transfer:.*of your current balance/i,
        /Amount.*is unusually far outside your typical range/i,
        /Amount ₹[\d,]+ is (much higher|higher) than your usual/i,
        /This transaction.*is.*higher than your usual amount/i,
        /Large transaction for.*your age group/i,
        /High.?value transaction/i,
        /\d+(\.\d+)?× (your avg|higher than)/i,
      ];
      // Priority order: drain > large-transfer > z-score > scam-amount > high-value
      // Keep whichever appears first in the priority list; suppress the rest.
      let keptAmountSignal = null;
      const kept = [];
      for (const s of allSignals) {
        const isAmt = amountSignalPriority.some(rx => rx.test(s));
        if (!isAmt) { kept.push(s); continue; }
        if (!keptAmountSignal) { keptAmountSignal = s; kept.push(s); }
        // else: duplicate amount signal — drop silently
      }
      allSignals = kept;

      // Try authoritative prepare (Phase 2D) — if backend reachable, use its transaction_id and risk
      let preparedId = null;
      let authoritativeRisk = null;
      try{
        const hdr = getAuthHeader();
        if(hdr.Authorization){
          const prepRes = await fetch(`${API}/transactions/prepare`, {method:"POST", headers:{...hdr, "Content-Type":"application/json"}, body: JSON.stringify({recipient: targetNum||recipient, amount: parsedAmt, note: note||""})});
          const prepData = await prepRes.json().catch(()=>({}));
          if(prepRes.ok && prepData.transaction_id){
            preparedId = prepData.transaction_id;
            authoritativeRisk = prepData.risk;
            // Override totalRisk/tier with authoritative if available
            totalRisk = prepData.risk.score;
            tier = prepData.risk.tier==="HIGH_RISK"?"high_risk": prepData.risk.tier==="CAUTION"?"caution":"normal";
            // Normalize signals: backend returns objects {description,id}, frontend expects strings
            const rawSigs = prepData.risk.signals || allSignals;
            allSignals = rawSigs.map(s => typeof s === 'string' ? s : (s.description || s.id || String(s)));
            console.log("[IRON] prepare authoritative", prepData);
          }
        }
      }catch(e){ console.warn("prepare failed", e); }
      setRiskData({
        score: totalRisk,
        signals: allSignals,
        action: ruleResult.action, tier, risk: ruleResult.risk,
        kwMatched, kwScore,
        urgencyHits: urgencyResult.urgencyHits,
        urgencyScore: urgencyResult.urgencyScore,
        transaction_id: preparedId,
        preparedId: preparedId,
        authoritative: !!authoritativeRisk,
        requires_otp: authoritativeRisk?.requires_otp ?? (tier==="high_risk"),
        backendRisk: authoritativeRisk,
        explanation: authoritativeRisk?.explanation || "",
        explanation_detail: authoritativeRisk?.explanation_detail || null,
        components: authoritativeRisk?.components || null
      });

      if (totalRisk < 40) {
        console.log("[IronWallet] setting stage=pin (low risk)");
        setStage("pin");
      } else if (totalRisk < 75) {
        console.log("[IronWallet] setting stage=popup (medium risk)");
        setStage("popup");
      } else {
        console.log("[IronWallet] setting stage=risk (high risk)");
        setStage("risk");
      }

      // ── WebSocket: broadcast fraud_alert when risk ≥ 70 ──────────────
      if (totalRisk >= 70 && window._ptSocket?.connected) {
        const { targetNum: tn } = getRecipientInfo();
        window._ptSocket.emit("fraud_alert", {
          userNumber:      user.number,
          riskScore:       totalRisk,
          amount:          parsedAmt,
          recipientNumber: tn || "",
          reason:          allSignals.slice(0,2).join("; ") || "High risk payment",
        });
        console.log("[IronWallet WS] 🚨 fraud_alert emitted, score:", totalRisk);
      }
      // ─────────────────────────────────────────────────────────────────
    }, 0);
    } catch (err) {
      console.error("[IronWallet] analyzeRisk crashed:", err);
      setBalErr(`Couldn't analyze: ${err && err.message ? err.message : String(err)}`);
      setStage("form");
    }
  }

  async function handleVerify(){
    // === Self-payment guard: users cannot pay themselves ===
    const { targetNum } = getRecipientInfo();
    if (targetNum && targetNum === user.number) {
      alert("❌ Self-payment is not allowed. Please enter a different recipient.");
      return;
    }

    // VPN & travel are now risk signals only — never block (Phase 1A)
    const vpnCheck = await checkVPNDetection(user.number);
    if (vpnCheck.vpnDetected) {
      console.warn("[IRON] VPN signal — HIGH_RISK warning, not block:", vpnCheck.reason);
      // Surface as risk signal via riskData if present, but do not return
    }

    // Location jump: also non-blocking — log as CAUTION signal
    if (GeoDeviceBaseline.location_enabled) {
      const freshLoc = await getFreshLocation();
      const travelCheck = checkImpossibleTravel(
        user.number,
        freshLoc.lat,
        freshLoc.lng,
        Date.now()
      );
      if (travelCheck.triggered) {
        console.warn("[IRON] Travel signal — CAUTION:", travelCheck.reason);
        // No confirm/return — user may proceed; signal will be shown in risk card if needed
      }
    }

    // ===== NEW: Show smart delay if high-value transaction =====
    if (riskData.requiresDelay) {
      setShowSmartDelay(true);
    } else {
      setStage("pin");
    }
  }

    if (transactionId) {

        await fetch(`${API}/security/ledger/events`, {
          method: "POST",

  async function completePayment(otpOverride=null){
    const a = parsedAmt;
    const { targetNum, name } = getRecipientInfo();
    // Phase 2G: authoritative backend — prepare was already done in analyzeRisk, now confirm.
    // A missing preparation is an error, never permission to create a local payment.
    const preparedId = riskData.transaction_id || riskData.preparedId;
    if (!preparedId) {
      setBalErr("Payment preparation has expired. Please assess the payment again.");
      setStage("form");
      return;
    }
    // Authenticated confirm
    try{
      const otpVal = otpOverride || riskData.otpValue || null;
      const hdr = getAuthHeader();
      const res = await fetch(`${API}/transactions/confirm`, {method:"POST", headers:{...hdr, "Content-Type":"application/json"}, body: JSON.stringify({transaction_id: preparedId, otp: otpVal})});
      const data = await res.json().catch(()=>({}));
      if(!res.ok){
        alert(data.error || "Transaction failed");
        // For idempotency, if duplicate, treat as success
        if(data.duplicate || res.status===409){ /* ignore */ }
        else return;
      }
      // Update authoritative balance & tx (updateBalance is the App-provided setter)
      if(data.balance != null) updateBalance(()=>data.balance);
      // Map backend tx to frontend format
      const txAuth = { id: data.transaction_id || preparedId, to: name || recipient, toNum: targetNum || recipient, upi: recipientType === 'upi' ? recipient : (USERS[targetNum]?.upi || ''), amt: a, date: new Date().toISOString().slice(0,10), time: new Date().toISOString().slice(11,16), risk: data.risk_score ?? riskData.score, status: (data.status==="HIGH_RISK"||data.status==="high_risk")?"high_risk": (data.status==="SUCCESS"?"success":data.status?.toLowerCase()||"success"), type: "debit", note: note || "Payment", isNew: true, risk_tag: (data.risk_tier||riskData.tier||"normal").toLowerCase(), otp_used: !!otpVal, location: (typeof MockLocation!=="undefined"&&MockLocation.active?MockLocation.label:null), device: (typeof getTxGeoDeviceMeta==="function"?getTxGeoDeviceMeta().device:null) };
      addTx(txAuth);
      // Do not locally deduct — backend already did; ensure UI reflects backend balance
      setLastTx(txAuth); setStage("success");
      // Record for duplicate warning (authoritative path)
      setRecentTxTimestamps(prev => {
        const cutoff = Date.now() - 4 * 60 * 1000;
        const pruned = prev.filter(x => x.ts > cutoff);
        return [...pruned, { toNum: targetNum || recipient, amt: a, ts: Date.now() }];
      });
      // Push via WS
      if (window._ptSocket?.connected && targetNum && targetNum in USERS) {
        window._ptSocket.emit("send_payment", { fromNumber: user.number, toNumber: targetNum, amount: a, txId: txAuth.id, timestamp: new Date().toISOString(), note: note || "Payment" }, (ack) => { console.log("[IronWallet WS] ✅ Delivered", ack); });
      }
      if (targetNum) { if (!user.known_recipients) user.known_recipients = new Set(); user.known_recipients.add(targetNum); }
      return;
    }catch(e){
      console.error("confirm failed", e);
      alert("Transaction failed: "+(e.message||"unknown"));
      return;
    }

    // Note: legacy duplicate handling removed — authoritative path handles all post-payment actions (Phase 12-14).
    // IRON never blocks — record as risk event only if needed (non-blocking)
    try { recordBlock(user); } catch {}
    // Record location/network for next transaction (non-blocking signals)
    try { getFreshLocation().then(loc => recordTxLocation(user.number, loc.lat, loc.lng, Date.now())); } catch {}
    try { getNetworkInfo().then(netInfo => recordTxNetwork(user.number, netInfo)); } catch {}
  }

  if (showCooldown && cooldownData) {
    return <CooldownModal 
      remaining={cooldownData.remaining}
      reason={cooldownData.reason}
      onClose={() => setShowCooldown(false)}
    />;
  }

  if (showFreeze && freezeData) {
    return <FreezeModal 
      message={freezeData.message || freezeData.reason}
      permanent={freezeData.permanent}
      remaining={freezeData.remaining}
      onClose={() => setShowFreeze(false)}
    />;

  if(stage==="success") return(

                  <span key={s} style={{padding:"4px 10px",
                    background:prog>(i+1)*20?"#dbeafe":"#f8faff",

                    fontSize:11,color:prog>(i+1)*20?"#C5A059":"#94a3b8",fontWeight:600,
                    display:"flex",alignItems:"center",gap:5}}>

              color:"#fff",fontWeight:700,
              cursor:(stage==="analyzing")?"not-allowed":"pointer",
              boxShadow:(stage==="analyzing")?"none":"0 6px 18px rgba(0,120,255,.28)"}}>

      )}

      {stage==="risk" && (
