              </span>
            </div>
          )}
          <FraudRiskCard
            score={riskData.score}
            recipient={getRecipientInfo().name || recipient}
            recipientNum={getRecipientInfo().targetNum || recipient}
            amount={parsedAmt}
            signals={riskData.signals}
            avgAmount={typeof calculateAvgTransaction === "function" ? calculateAvgTransaction(user) : 0}
            historyCount={user.transactions?.length || 0}
            onVerify={handleVerify}
            onCancel={cancelPayment}
            onReport={handleReport}
            tier={riskData.tier}
            kwMatched={riskData.kwMatched || []}
            urgencyHits={riskData.urgencyHits || []}
            urgencyScore={riskData.urgencyScore || 0}
          />
          <div style={{display:"none"}}>
          {/* Advanced investigation tools belong in the SOC, not the payment flow. */}
          <div style={{display:"flex", gap:8, marginTop:12, marginBottom:8}}>
            <button
              onClick={() => setShowAIInvestigator(v => !v)}
              style={{flex:1, padding:"10px", background: showAIInvestigator ? "#1B263B" : "#fff", color: showAIInvestigator ? "#fff" : "#1B263B", border:"1px solid #1B263B", borderRadius:6, fontWeight:700, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:6}}
            >
              🤖 {showAIInvestigator ? "Hide Investigation" : "Investigate with AI"}
            </button>
            <button
              onClick={() => setShowSimulator(v => !v)}
              style={{flex:1, padding:"10px", background: showSimulator ? "#1B263B" : "#fff", color: showSimulator ? "#fff" : "#1B263B", border:"1px solid #1B263B", borderRadius:6, fontWeight:700, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:6}}
            >
              🧪 {showSimulator ? "Hide Simulator" : "What-If Simulator"}
            </button>
          </div>
          {showAIInvestigator && riskData.transaction_id && (
            <AIInvestigatorPanel transactionId={riskData.transaction_id} onClose={() => setShowAIInvestigator(false)} />
          )}
          {showAIInvestigator && !riskData.transaction_id && (
            <div style={{padding:"10px 12px", background:"#fffbeb", border:"1px solid #fde68a", borderRadius:6, color:"#92400e", fontSize:12, marginBottom:8}}>
              Transaction not yet prepared — AI investigation available after risk assessment.
            </div>
          )}
          {showSimulator && (
            <WhatIfSimulator onClose={() => setShowSimulator(false)} />
          )}
          {/* Phase 11: Live Protection alerts */}
          {typeof window !== "undefined" && window._ironLive && window._ironLive.liveAlerts && window._ironLive.liveAlerts.length > 0 && (
            <div style={{marginTop:12, padding:"10px 12px", background:"#fef2f2", border:"1px solid #fca5a5", borderRadius:6}}>
              <div style={{fontSize:12, fontWeight:700, color:"#991b1b", marginBottom:6}}>🔔 Live Protection Alerts</div>
              {window._ironLive.liveAlerts.slice(-3).map((a,i) => (
                <div key={i} style={{fontSize:12, color:"#7f1d1d", marginBottom:4}}>• {a.message} <span style={{opacity:0.6}}>({a.event})</span></div>
              ))}
            </div>
          )}
          </div>
        </>
        </div>
        </Modal>
      )}
      {stage==="popup" && (
        <Card style={{padding:0, marginBottom:18, border:`1px solid ${GOLD_BORDER}`, overflow:'hidden'}}>
          {/* Header strip — matches the page title styling */}
          <div style={{
            display:'flex', alignItems:'center', justifyContent:'space-between',
            padding:'14px 20px',
            background:`linear-gradient(135deg, ${B}, ${B2})`,
            color:'#fff',
          }}>
            <div style={{display:'flex', alignItems:'center', gap:10}}>
              <span style={{
                width:32, height:32, borderRadius:8,
                background:'rgba(197,160,89,0.18)',
                border:`1px solid ${GOLD_BORDER}`,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:16,
              }}>⚠</span>
              <div>
                <h3 style={{margin:0, fontSize:16, fontWeight:800, color:'#fff', letterSpacing:0.2}}>
                  Risk Warning
                </h3>
                <p style={{margin:0, fontSize:12, color:'rgba(255,255,255,0.7)'}}>
                  Please review the payment details and security context before proceeding.
                </p>
              </div>
            </div>
            <button
              onClick={()=>setStage("form")}
              aria-label="Dismiss"
              style={{
                background:'rgba(255,255,255,0.08)',
                border:'1px solid rgba(255,255,255,0.15)',
                color:'#fff',
                width:30, height:30, borderRadius:8,
                fontSize:18, lineHeight:1, cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center',
              }}
            >×</button>
          </div>

          {/* Body — transaction details */}
          <div style={{padding:'18px 20px', background:'#fff'}}>
            <p style={{margin:0, fontSize:13, color:'#45474D', lineHeight:1.5}}>
              Please review the details below before proceeding with this payment.
            </p>

            <div style={{
              marginTop:14, padding:'12px 14px',
              background:'rgba(197,160,89,0.08)',
              border:`1px solid ${GOLD_BORDER}`,
              borderRadius:8,
              display:'flex', flexDirection:'column', gap:6,
            }}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:13}}>
                <span style={{color:'#64748b', fontWeight:600}}>To</span>
                <span style={{color:'#1A1C1A', fontWeight:700}}>
                  {getRecipientInfo().name || recipient}
                </span>
              </div>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:13}}>
                <span style={{color:'#64748b', fontWeight:600}}>Amount</span>
                <span style={{color:'#1A1C1A', fontWeight:800, fontSize:15}}>
                  ₹{Number(parsedAmt).toLocaleString("en-IN")}
                </span>
              </div>
            </div>

            <div style={{display:'flex', gap:10, marginTop:18}}>
              <button
                onClick={()=>setStage("form")}
                style={{
                  flex:1, padding:'12px', borderRadius:8,
                  border:'1.5px solid #E0E1DD', background:'#fff',
                  color:'#1A1C1A', fontWeight:700, fontSize:14,
                  cursor:'pointer', fontFamily:"'DM Sans', sans-serif",
                }}
              >
                Cancel
              </button>
              <button
                onClick={()=>setStage("pin")}
                className="btn-primary"
                style={{
                  flex:1, padding:'12px', borderRadius:8, border:'none',
                  background:`linear-gradient(135deg, ${B}, ${B2})`,
                  color:'#fff', fontWeight:700, fontSize:14, cursor:'pointer',
                  fontFamily:"'DM Sans', sans-serif",
                  boxShadow:'0 6px 18px rgba(27,38,59,0.28)',
                }}
              >
                Proceed to PIN →
              </button>
            </div>
          </div>
        </Card>
      )}
    </div>
  );
}

  const [freezeData, setFreezeData] = useState(null);
  // ── Report modal state: null | { req } ──
  const [reportModal, setReportModal] = useState(null);

  useEffect(() => { setLocalRequests(requests); }, [requests]);

  useEffect(() => {
    const frozen = checkFrozen(user);
    if (frozen.frozen) { setFreezeData(frozen); setShowFreeze(true); }
  }, [user]);

  /* ── Red-flag keyword scanner for payment request notes ── */
  const REQ_SCAM_KEYWORDS = [
    // Greed hooks (critical tier — +50 to +60)
    "prize","lucky draw","won","cashback","reward","lottery","free prize","you won","congratulations",
    "cash win","free win","award","gift card","bonus prize",
    // Urgency / fear (critical tier — +48 to +55)
    "blocked","electricity bill","emergency","processing fee","pending fine","penalty","charge",
    "admin fee","refund fee","claim prize","verify account","account blocked","urgent payment",
    // Authority hooks (critical tier — +48 to +55)
    "kyc update","bank officer","verification","refund department","support","aadhaar update",
    "pan card","immediate action","act now","limit exceeded"
  ];

  // Tiered keyword penalty based on sender verification
  function scanNoteKeywords(note, senderVerified = false) {
    if (!note) return { hit: false, matched: [], penalty: 0, tier: null };
    const lower = note.toLowerCase();
    const matched = REQ_SCAM_KEYWORDS.filter(kw => lower.includes(kw));
    if (matched.length === 0) return { hit: false, matched: [], penalty: 0, tier: null };
    // Unknown/unverified sender + scam keyword → critical penalty
    if (!senderVerified) {
      const critical = matched.some(k => ["prize","lucky draw","won","emergency","refund fee","claim prize"].some(c => lower.includes(c)));
      return { hit: true, matched, penalty: critical ? 60 : 50, tier: "critical" };
    }
    // Known sender but still flagged → medium-high
    return { hit: true, matched, penalty: 35, tier: "high" };
  }

  /* ── Risk helpers for a request — with keyword penalty & deduplication ── */
  function reqRiskInfo(req) {
    const result        = calculateRisk(user, req.amt, req.fromNum);
    const senderVerified = (user.contacts || {}).hasOwnProperty(req.fromNum);
    const kwScan        = scanNoteKeywords(req.reason, senderVerified);
    const kwPenalty     = kwScan.penalty;

    // Deduplicate amount-based signals before adding keyword ones
    const amtPatterns = [
      /This transaction drains \d+% of your balance/i,
      /Large transfer:.*of your current balance/i,
      /Amount.*is unusually far outside your typical range/i,
      /Amount ₹[\d,]+ is (much higher|higher) than your usual/i,
      /This transaction.*is.*higher than your usual amount/i,
      /Large transaction for.*your age group/i,
      /High.?value transaction/i,
      /\d+(\.\d+)?× (your avg|higher than)/i,
    ];
    let seenAmt = false;
    const dedupedSignals = result.signals.filter(s => {
      const isAmt = amtPatterns.some(rx => rx.test(s));
      if (isAmt) { if (!seenAmt) { seenAmt = true; return true; } return false; }
      return true;
    });

    // Append keyword signals if triggered
    const signals = [...dedupedSignals];
    if (kwScan.hit) {
      const severity = kwScan.tier === "critical" ? "🚨 Critical" : "⚠️ High";
      signals.push(
        `${severity} scam keyword${kwScan.matched.length > 1 ? "s" : ""} in note: "${kwScan.matched.slice(0,3).join('", "')}" — high-fraud pattern.`
      );
    }

    let rawRisk = result.risk + kwPenalty;

    // ── Minimum risk floor for scam keywords ──
    if (kwScan.hit) {
      const hasOtherSignals = result.signals.length > 0 || rawRisk > result.risk;
      const floor = hasOtherSignals ? 85 : 70;
      rawRisk = Math.max(rawRisk, floor);
    }

    const totalRisk = Math.min(100, user.risk_score + rawRisk);
    let tier = 'normal';
    if (totalRisk >= 70)  tier = 'otp';
    else if (totalRisk >= RISK_INFO) tier = 'info';
    return { result: {...result, risk: rawRisk, signals}, totalRisk, tier, kwScan };
  }

  async function acceptReq(req) {
    // VPN signal — HIGH_RISK warning, never blocks (Phase 1A)
    const vpnCheck = await checkVPNDetection(user.number);
    if (vpnCheck.vpnDetected) {
      console.warn("[IRON] VPN signal — HIGH_RISK warning:", vpnCheck.reason);
    }

    const { result, totalRisk, tier } = reqRiskInfo(req);
    setVerifying({ req, result, tier, totalRisk });
    // Admin accounts skip OTP and go straight to PIN
    setVerifyStage((tier !== 'normal' && !user.isAdmin) ? 'otp' : 'pin');
  }

  async function completeAccept() {
    const { req, result, tier } = verifying;
    const { date, time } = nowStamp();
    if (req.amt > user.balance) {
      alert("Insufficient balance to pay this request");
      setVerifying(null); return;
    }

    // VPN signal — HIGH_RISK warning, never blocks (Phase 1A)
    const vpnCheck = await checkVPNDetection(user.number);
    if (vpnCheck.vpnDetected) {
      console.warn("[IRON] VPN signal — HIGH_RISK warning:", vpnCheck.reason);
    }

    const otpUsed = tier === 'otp' || tier === 'high_risk';
    const status  = tier === 'high_risk' ? 'verified' : 'success';
    const tx = {
      id: Date.now(), to: req.from, toNum: req.fromNum, upi: req.upi,
      amt: req.amt, date, time, risk: verifying.totalRisk, status,
      type: "debit", note: req.reason, isNew: true,
      risk_tag: tier, otp_used: otpUsed
    };
    addTx(tx);
    updateBalance(b => b - req.amt);
    if (req.fromNum) {
      if (!user.known_recipients) user.known_recipients = new Set();
      user.known_recipients.add(req.fromNum);
    }
    user.risk_score = Math.max(0, user.risk_score + result.risk - (otpUsed ? OTP_DISCOUNT : 0));
    resolveRequest(req.id, "paid");
    setLocalRequests(prev => prev.map(r => r.id === req.id ? {...r, status:"paid"} : r));

    // Record network info for VPN detection on the NEXT transaction.
    getNetworkInfo().then(netInfo => {
      recordTxNetwork(user.number, netInfo);
    });

    setVerifying(null);
  }

  function declineReq(id) {
    resolveRequest(id, "declined");
    setLocalRequests(prev => prev.map(r => r.id === id ? {...r, status:"declined"} : r));
  }

  function openReportModal(req) { setReportModal({ req }); }

  function completeReport(reason) {
    const { req } = reportModal;
    if (req.fromNum) {
      reportRecipient(user.number, req.fromNum, req.amt, reason);
    }
    resolveRequest(req.id, "reported");
    setLocalRequests(prev => prev.map(r => r.id === req.id ? {...r, status:"reported"} : r));
    setReportModal(null);
  }

  const pending  = localRequests.filter(r => r.status === "pending");
  const resolved = localRequests.filter(r => r.status !== "pending");

  if (showFreeze && freezeData) {
    return <FreezeModal message={freezeData.message} permanent={freezeData.permanent}
      remaining={freezeData.remaining} onClose={() => setShowFreeze(false)}/>;
  }

  return(
    <div className="page-pad page-enter" style={{padding:24,maxWidth:720,margin:"0 auto"}}>

      {/* ── Report Reason Modal ── */}
      {reportModal && (
        <ReportReasonModal
          title="Report This Request"
          onSelect={completeReport}
          onCancel={() => setReportModal(null)}
        />
      )}

      {/* ── OTP / PIN verification modals ── */}
      {verifying && (
        verifying.tier !== 'normal' && verifyStage === 'otp' ? (
          <OTPModal
            mobile={user.number}
            onSuccess={() => setVerifyStage('pin')}
            onCancel={() => { setVerifying(null); setVerifyStage('otp'); }}
          />
        ) : (
          <PINModal
            userPin={user.pin} user={user}
            onSuccess={completeAccept}
            onCancel={() => { setVerifying(null); setVerifyStage('otp'); }}
          />
        )
      )}

      <PageHeader
        title="Payment Requests"
        subtitle={`${pending.length} pending · ${resolved.length} resolved · Paying these will debit your balance`}
        onBack={() => setPage("dashboard")}
      />

      {localRequests.length===0 && (
        <Card style={{padding:"40px",textAlign:"center"}}>
          <div style={{color:"#75777D",fontSize:15}}>No payment requests.</div>
        </Card>
      )}

      {localRequests.map((req, ri) => {
        const { result, totalRisk, tier, kwScan } = reqRiskInfo(req);
        const m = riskMeta(totalRisk);
        const requiresOTP  = totalRisk >= 70;   // 70+: PIN+OTP enforced
        const useOTPLabel  = totalRisk >= 90;          // 90+: button reads "Verify with OTP"
        const needsTimer   = totalRisk >= 90;          // 90+: timer shown
        const isSuspicious = requiresOTP;
        const recipRisk    = getRecipientRisk(req.fromNum || "");
        const recipReason  = getRecipientReportReason(req.fromNum || "");

        // signals are already deduped inside reqRiskInfo
        const signals = result.signals || [];

        return (
          <Card key={req.id} style={{
            padding: 0, marginBottom: 16, overflow: "hidden",
            border: (req.id === 999 || (needsTimer && recipRisk > 0))
                    ? "2px solid #dc2626"
                    : needsTimer ? "1.5px solid #fca5a5"
                    : isSuspicious ? "1.5px solid #fdba74"
                    : "1px solid rgba(0,80,200,.07)",
            boxShadow: (req.id === 999 || (needsTimer && recipRisk > 0))
                    ? "0 0 0 3px rgba(220,38,38,.15), 0 8px 28px rgba(220,38,38,.18)"
                    : undefined,
          }}>
            {/* risk accent bar */}
            <div style={{height:4, background:`linear-gradient(90deg,${m.dot},${m.color})`, borderRadius:"18px 18px 0 0"}}/>

            <div style={{padding:"18px 20px 0"}}>
              {/* ── 90+ Extra Caution Banner ── */}
              {needsTimer && req.status === "pending" && (
                <div style={{
                  display:"flex", alignItems:"flex-start", gap:10,
                  padding:"11px 14px", marginBottom:14,
                  background:"linear-gradient(135deg,#fef2f2,#fff1f2)",
                  border:"2px solid #dc2626", borderRadius:6,
                  animation:"slideDown .3s ease"
                }}>
                  <span style={{fontSize:20, lineHeight:1, flexShrink:0}}>⚠️</span>
                  <div>
                    <div style={{fontWeight:800, fontSize:13, color:"#ba1a1a"}}>BE EXTRA CAREFUL</div>
                    <div style={{fontSize:12, color:"#991b1b", marginTop:2, lineHeight:1.4}}>
                      This request has multiple high-risk signals. Verify the sender's identity before paying.
                    </div>
                  </div>
                </div>
              )}

              {/* ── Suspicious (85–89) inline warning ── */}
              {isSuspicious && !needsTimer && req.status === "pending" && (
                <div style={{
                  display:"flex", alignItems:"center", gap:9,
                  padding:"9px 13px", marginBottom:12,
                  background:"#fff7ed", border:"1px solid #fdba74", borderRadius:4,
                  animation:"slideDown .3s ease"
                }}>
                  {Ic.warn("#f97316")}
                  <span style={{fontSize:12, color:"#92400e", fontWeight:600}}>
                    Suspicious request — OTP verification required before paying
                  </span>
                </div>
              )}

              {/* ── Request header ── */}
              <div style={{display:"flex", alignItems:"center", gap:14, marginBottom:14}}>
                <Avatar name={req.from} size={48}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800, fontSize:15, color:"#1A1C1A"}}>{req.from}</div>
                  <div style={{fontSize:12, color:"#75777D", marginTop:2}}>{req.upi} · {req.ago}</div>
                  <div style={{fontSize:12, color:"#45474D", fontStyle:"italic", marginTop:3}}>"{req.reason}"</div>
                  {/* Prior report signal from registry */}
                  {recipRisk >= 1 && (
                    <div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:5}}>
                      <div style={{display:"inline-flex", alignItems:"center", gap:5,
                        padding:"3px 10px", background:"#fff9f9", border:"1px solid #fca5a5",
                        borderRadius:6, fontSize:11, fontWeight:700, color:"#ba1a1a"}}>
                        {Ic.flag("#dc2626")}
                        ⚠ Reported {recipRisk}× {recipReason ? `for ${recipReason}` : "in network"}
                      </div>
                      {recipRisk > 3 && (
                        <div style={{display:"inline-flex", alignItems:"center", gap:5,
                          padding:"3px 10px", background:"#450a0a", border:"1px solid #dc2626",
                          borderRadius:6, fontSize:11, fontWeight:700, color:"#fca5a5"}}>
                          🚨 High-risk recipient
                        </div>
                      )}
                    </div>
                  )}
                </div>
                <div style={{textAlign:"right", flexShrink:0}}>
                  <div style={{fontWeight:800, fontSize:20, color:"#ba1a1a"}}>
                    −₹{req.amt.toLocaleString("en-IN")}
                  </div>
                  <div style={{fontSize:11, color:"#75777D", marginTop:2}}>will debit your account</div>
                  <div style={{marginTop:6}}>
                    <RiskPill score={totalRisk}/>
                  </div>
                </div>
              </div>

              {/* ── Engine Insights (deduped signals) ── */}
              {signals.length > 0 && req.status === "pending" && (
                <div style={{marginBottom:12}}>
                  <p style={{fontSize:10, fontWeight:800, color:"#75777D",
                    textTransform:"uppercase", letterSpacing:.8, marginBottom:7}}>
                    🔍 Engine Insights
                  </p>
                  <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                    {signals.slice(0,5).map((s, i) => {
                      const isKW = s.startsWith("⚠️") || s.startsWith("🚨");
                      return (
                        <div key={i} style={{
                          display:"flex", alignItems:"flex-start", gap:7,
                          padding:"6px 10px",
                          background: isKW ? "#fff7ed" : m.bg,
                          border:`1px solid ${isKW ? "#fdba74" : m.border}`,
                          borderRadius:9, fontSize:12,
                          color: isKW ? "#92400e" : m.color,
                          fontWeight: isKW ? 600 : 500, lineHeight:1.4,
                          animation:`slideInL .2s ${i*.06}s ease both`
                        }}>
                          <svg width="6" height="6" style={{flexShrink:0, marginTop:4}}>
                            <circle cx="3" cy="3" r="3" fill={isKW ? "#f59e0b" : m.dot}/>
                          </svg>
                          {s}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ── Why is this risky? (Layer 2: short reasons + Layer 3: tags) ── */}
              {req.status === "pending" && totalRisk >= 60 && (()=>{
                const TAG_STYLE_REQ = (tag) => {
                  const map = {
                    "Reported":    {c:"#dc2626", bg:"#fef2f2", bd:"#fca5a5"},
                    "New":         {c:"#f59e0b", bg:"#fef3c7", bd:"#fcd34d"},
                    "High Amount": {c:"#f97316", bg:"#fff7ed", bd:"#fdba74"},
                    "Large Spend": {c:"#ea580c", bg:"#fff7ed", bd:"#fb923c"},
                    "Odd Hour":    {c:"#7c3aed", bg:"#f5f3ff", bd:"#c4b5fd"},
                    "Off-Network": {c:"#0369a1", bg:"#e0f2fe", bd:"#7dd3fc"},
                  };
                  return map[tag] || {c:"#64748b", bg:"#f8faff", bd:"#e2e8f0"};
                };
                const rr2 = getRecipientRisk(req.fromNum || "");
                const reqReasons = [];
                const reqTags    = [];
                if (rr2 > 0) { reqReasons.push(`Reported by ${rr2} user${rr2>1?"s":""}`); reqTags.push("Reported"); }
                signals.forEach(s => {
                  const sl = s.toLowerCase();
                  if ((sl.includes("new recipient") || sl.includes("not seen in your contacts")) &&
                      !reqReasons.some(r=>r.toLowerCase().includes("new"))) {
                    reqReasons.push("New recipient"); reqTags.push("New");
                  }
                  if ((sl.includes("drain") || sl.includes("large transfer") || sl.includes("higher than your usual") || sl.includes("unusually far outside")) &&
                      !reqReasons.some(r=>r.toLowerCase().includes("amount"))) {
                    reqReasons.push("High amount"); if(!reqTags.includes("High Amount")) reqTags.push("High Amount");
                  }
                  if ((sl.includes("off-network") || sl.includes("outside the upi network")) &&
                      !reqReasons.some(r=>r.toLowerCase().includes("network"))) {
                    reqReasons.push("Off-network account"); if(!reqTags.includes("Off-Network")) reqTags.push("Off-Network");
                  }
                  if ((sl.includes("daily spending") || sl.includes("starting balance") || sl.includes("portion")) &&
                      !reqReasons.some(r=>r.toLowerCase().includes("spend"))) {
                    reqReasons.push("Large spend"); if(!reqTags.includes("Large Spend")) reqTags.push("Large Spend");
                  }
                });
                const dedupedR = [...new Set(reqReasons)];
                const dedupedT = [...new Set(reqTags)];
                if(dedupedR.length === 0) return null;
                return (
                  <div style={{marginBottom:12,padding:"10px 12px",background:"#fff7ed",
                    border:"1.5px solid #fdba74",borderRadius:4,animation:"slideInL .3s ease both"}}>
                    <p style={{fontSize:10,fontWeight:800,color:"#92400e",textTransform:"uppercase",
                      letterSpacing:.6,marginBottom:7}}>🤔 Why is this risky?</p>
                    {dedupedR.map((r,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"flex-start",gap:6,marginBottom:4,
                        fontSize:12,color:"#9a3412",fontWeight:600,lineHeight:1.4}}>
                        <span style={{flexShrink:0}}>⚠</span><span>{r}</span>
                      </div>
                    ))}
                    {dedupedT.length > 0 && (
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8}}>
                        {dedupedT.map((tag,i)=>{
                          const ts = TAG_STYLE_REQ(tag);
                          return(
                            <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4,
                              padding:"2px 9px",borderRadius:6,fontSize:11,fontWeight:700,
                              background:ts.bg,color:ts.c,border:`1.5px solid ${ts.bd}`}}>
                              {tag}
                            </span>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>

            {/* ── Status / Actions ── */}
            <div style={{padding:"0 20px 18px", marginTop:4}}>
              {req.status !== "pending" ? (
                <div style={{
                  padding:"10px 16px",
                  background: req.status==="paid"?"#dcfce7" : req.status==="declined"?"#f1f5f9" : "#fef2f2",
                  borderRadius:4,
                  color: req.status==="paid"?"#166534" : req.status==="declined"?"#64748b" : "#dc2626",
                  fontWeight:700, fontSize:13, textAlign:"center",
                  display:"flex", alignItems:"center", justifyContent:"center", gap:7
                }}>
                  {req.status==="paid" && <>{Ic.check("#166534")} Paid — debited from your account</>}
                  {req.status==="declined" && <>{Ic.x("#64748b")} Declined</>}
                  {req.status==="reported" && <>{Ic.flag("#dc2626")} Reported as fraud</>}
                </div>
              ) : (
                <div style={{display:"flex", gap:8}}>
                  <Btn onClick={() => acceptReq(req)} style={{flex:1}}>
                    {useOTPLabel ? "Verify with OTP →" : requiresOTP ? "Pay with PIN+OTP" : "Pay with PIN"}
                  </Btn>
                  <Btn onClick={() => declineReq(req.id)} variant="ghost" style={{flex:1}}>Decline</Btn>
                  <Btn onClick={() => openReportModal(req)} variant="danger">
                    {Ic.flag("#dc2626")} Report
                  </Btn>
                </div>
              )}
            </div>
          </Card>
        );
      })}
    </div>
  );
}

/* ═══ HISTORY PAGE ═══ */
function HistoryPage({txs, user, tickets, createTicket, setPage}){
  const [filter, setFilter] = useState("all");
  const [reportIssueTx, setReportIssueTx] = useState(null); // tx to report
  const [toast, setToast] = useState("");
  const [selectedTx, setSelectedTx] = useState(null); // Phase 14: detail view

  function showToastMsg(msg){ setToast(msg); setTimeout(()=>setToast(""),4000); }

  const filtered = txs.filter(t => {
    if (filter === "credit") return t.type === "credit";
    if (filter === "debit") return t.type === "debit";
    if (filter === "flagged") return t.risk >= 40;
    if (filter === "high_risk") return t.status === "high_risk" || t.status === "blocked";
    if (filter === "otp") return t.otp_used;
    return true;
  });

  return(
    <div className="page-pad page-enter" style={{padding:"24px 24px",maxWidth:"1400px",margin:"0 auto"}}>
      {toast && <div className="pt-toast">{toast}</div>}
      {selectedTx && (
        <Modal>
          <div style={{background:"#fff", borderRadius:8, maxWidth:480, width:"90%", maxHeight:"90vh", overflowY:"auto", padding:0}}>
            <TransactionDetailCard tx={selectedTx} risk={{score:selectedTx.risk, tier: (selectedTx.risk>=85?"HIGH_RISK":selectedTx.risk>=70?"CAUTION":"SAFE"), requires_otp: selectedTx.otp_used, explanation_detail:{reasons:[]}}} onClose={()=>setSelectedTx(null)} />
            <div style={{padding:"12px 16px", textAlign:"center"}}>
              <Btn onClick={()=>setSelectedTx(null)} variant="ghost">Close</Btn>
            </div>
          </div>
        </Modal>
      )}
      {reportIssueTx && (
        <ReportIssueModal
          tx={reportIssueTx}
          user={user}
          onClose={() => setReportIssueTx(null)}
          onSubmit={(reason, note, ticketId) => {
            const id = createTicket(reportIssueTx, reason, note, user, ticketId);
            setReportIssueTx(null);
            showToastMsg(`Complaint registered – Ref ID: ${id}`);
          }}
        />
      )}
      <PageHeader
        title="Transaction History"
        subtitle={`${txs.length} total transactions`}
        onBack={() => setPage("dashboard")}
      />
      
      <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
        {["all","debit","credit","flagged","high_risk","otp"].map(f => (
          <button key={f} onClick={() => setFilter(f)}
            style={{padding:"7px 18px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700,
              border:"none",background:filter===f?"#1B263B":"rgba(197,160,89,0.08)",
              color:filter===f?"#C5A059":"#1B263B"}}>
            {f==="high_risk"?"High Risk": f.charAt(0).toUpperCase() + f.slice(1)}
          </button>
        ))}
      </div>
      
      <Card style={{overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#FAFAF8"}}>
                {["Date","Recipient / Sender","Amount","Note","Location","OTP","Status","Actions"].map(h => (
                  <th key={h} style={{padding:"13px 16px",color:"#75777D",fontSize:11,fontWeight:800,
                    textAlign:"left",whiteSpace:"nowrap",borderBottom:"1px solid #f0f6ff"}}>
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0 && (
                <tr><td colSpan={8} style={{padding:"40px",textAlign:"center",color:"#75777D"}}>No transactions found.</td></tr>
              )}
              {filtered.map((tx,i) => {
                const m = riskMeta(tx.risk);
                const hasTicket = tickets && tickets.some(t => t.transaction_id === tx.id);
                const recRisk = getRecipientRisk(tx.toNum || "");
                return (
                  <tr key={tx.id} style={{borderBottom:i<filtered.length-1?"1px solid #f8faff":"none"}}>
                    <td style={{padding:"13px 16px",whiteSpace:"nowrap"}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#1A1C1A"}}>{tx.date}</div>
                      <div style={{fontSize:11,color:"#75777D"}}>{tx.time}</div>
                    </td>
                    <td style={{padding:"13px 16px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>

                );

            </tbody>

      </Card>

function XAIExplainCard({user, txs}){
  const lastTx = txs[0];
  if(!lastTx) return null;
  const avg = calculateAvgTransaction(user);
  const std = calculateStdDeviation(user, avg);
  const z   = std>0 ? Math.abs((lastTx.amt - avg)/std) : 0;
  const bal = user.balance;
  const inContacts = lastTx.toNum && (lastTx.toNum in (user.contacts||{}));
  const inHistory  = lastTx.toNum && user.known_recipients?.has(lastTx.toNum);
  const inUPI      = lastTx.toNum && (lastTx.toNum in USERS);
  const spentToday = getDailySpent(user);
  const startBal   = Math.max(bal + spentToday, 1);
  const dailyPct   = ((spentToday + lastTx.amt) / startBal * 100).toFixed(0);

  const reasons = [];
  if(lastTx.amt / Math.max(bal,1) > 0.5) reasons.push({icon:"💸", label:"Unusual Amount", detail:`₹${lastTx.amt.toLocaleString()} is >50% of balance`, risk:"high"});
  if(!inContacts && !inHistory) reasons.push({icon:"👤", label:"New Recipient", detail:"Not in contacts or history", risk:"medium"});
  if(!inUPI) reasons.push({icon:"🌐", label:"Off-Network", detail:"Recipient not in UPI registry", risk:"high"});
  if(z > 2) reasons.push({icon:"📊", label:"Abnormal Amount", detail:`${z.toFixed(1)}σ from your avg (₹${Math.round(avg).toLocaleString()})`, risk:"medium"});
  if(dailyPct > 70) reasons.push({icon:"📅", label:"High Daily Spend", detail:`${dailyPct}% of today's starting balance`, risk:"medium"});
  if(lastTx.risk_tag === "otp" || lastTx.risk_tag === "high_risk") reasons.push({icon:"⏰", label:"High-Risk Transaction", detail:"Required OTP verification", risk:"high"});

  if(reasons.length === 0) reasons.push({icon:"✅", label:"Low Risk Pattern", detail:"No significant anomalies detected", risk:"low"});

  const riskColor = {high:"#dc2626", medium:"#f59e0b", low:"#22c55e"};
  const riskBg    = {high:"#fef2f2", medium:"#fef3c7", low:"#dcfce7"};

  return(
    <div>
      <div style={{fontSize:12,color:"#45474D",marginBottom:12}}>
        Explaining last transaction: <b style={{color:"#1A1C1A"}}>₹{lastTx.amt.toLocaleString()}</b> to <b style={{color:"#1A1C1A"}}>{lastTx.to||lastTx.from||"?"}</b>
      </div>
      {reasons.map((r,i)=>(
        <div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",
          background:riskBg[r.risk],borderRadius:4,marginBottom:8,
          border:`1px solid ${riskColor[r.risk]}22`}}>
          <span style={{fontSize:16,lineHeight:1}}>{r.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13,color:riskColor[r.risk]}}>{r.label}</div>
            <div style={{fontSize:12,color:"#45474D",marginTop:2}}>{r.detail}</div>
          </div>
          <span style={{padding:"2px 8px",background:riskColor[r.risk],color:"#fff",
            borderRadius:6,fontSize:10,fontWeight:700,whiteSpace:"nowrap",alignSelf:"center"}}>
            {r.risk.toUpperCase()}
          </span>
        </div>
      ))}
    </div>
  );
}

function EDAPatterns({txs}){
  const fraudTxs  = txs.filter(t=>t.status==="high_risk" || t.status==="blocked");
  const legitTxs  = txs.filter(t=>t.status!=="high_risk" && t.status!=="blocked");
  const avgFraud  = fraudTxs.length ? Math.round(fraudTxs.reduce((s,t)=>s+t.amt,0)/fraudTxs.length) : 0;
  const avgLegit  = legitTxs.length ? Math.round(legitTxs.reduce((s,t)=>s+t.amt,0)/legitTxs.length) : 0;

  // Hour distribution
  const hourBuckets = {night:0, morning:0, afternoon:0, evening:0};
  txs.forEach(t=>{
    const h = t.time ? parseInt(t.time.split(":")[0]) : 12;
    if(h>=1&&h<5)       hourBuckets.night++;
    else if(h>=5&&h<12) hourBuckets.morning++;
    else if(h>=12&&h<18)hourBuckets.afternoon++;
    else                 hourBuckets.evening++;
  });

  // New recipient fraud rate
  const newRecFraud = txs.filter(t=>t.risk_tag==="high_risk"||t.risk>=95).length;
  const otpTxs      = txs.filter(t=>t.otp_used).length;

  const patterns = [
    {icon:"💰", label:"Avg High-Risk Amount", val:`₹${avgFraud.toLocaleString()}`, note:"vs ₹"+avgLegit.toLocaleString()+" legitimate", color:"#ba1a1a", bg:"#fef2f2"},
    {icon:"🌙", label:"Night-Time Suspicious", val:hourBuckets.night, note:"Txns 1AM–5AM (high-risk window)", color:"#7c3aed", bg:"#f5f3ff"},
    {icon:"👤", label:"High-Risk Flagged", val:newRecFraud, note:"Scored ≥95 risk or high_risk tier", color:"#f59e0b", bg:"#fef3c7"},
    {icon:"🔐", label:"OTP Interventions", val:otpTxs, note:"Extra verification required", color:"#C5A059", bg:"rgba(197,160,89,0.08)"},
  ];

  const timeLabels = ["Night (1-5AM)","Morning (5-12)","Afternoon (12-6PM)","Evening (6-1AM)"];
  const timeVals   = [hourBuckets.night, hourBuckets.morning, hourBuckets.afternoon, hourBuckets.evening];
  const timeColors = ["#dc2626","#22c55e","#C5A059","#f59e0b"];
  const maxTime    = Math.max(...timeVals, 1);

  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {patterns.map(p=>(
          <div key={p.label} style={{background:p.bg,borderRadius:6,padding:"14px",
            border:`1px solid ${p.color}22`}}>
            <div style={{fontSize:20,marginBottom:4}}>{p.icon}</div>
            <div style={{fontSize:18,fontWeight:800,color:p.color}}>{p.val}</div>
            <div style={{fontSize:11,fontWeight:700,color:p.color,marginBottom:2}}>{p.label}</div>
            <div style={{fontSize:10,color:"#75777D"}}>{p.note}</div>
          </div>
        ))}
      </div>
      <div style={{fontWeight:700,fontSize:13,color:"#1A1C1A",marginBottom:10}}>
        🕐 Time-Based Fraud Pattern
      </div>
      {timeLabels.map((lbl,i)=>(
        <div key={lbl} style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
            <span style={{fontSize:11,color:"#45474D"}}>{lbl}</span>
            <span style={{fontSize:11,fontWeight:700,color:timeColors[i]}}>{timeVals[i]} txns</span>
          </div>
          <div style={{height:7,background:"#FDFCFB",borderRadius:4,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${(timeVals[i]/maxTime)*100}%`,
              background:timeColors[i],borderRadius:4}}/>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ═══ LOCATION CARD (Geo-enhanced Profile) ═══ */
function LocationCard({ user }){
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState("");
  const[loc,setLoc]=useState(GeoDeviceBaseline.location?.display || null);
  const[editing,setEditing]=useState(false);
  const[manual,setManual]=useState("");

  function refreshLocation(){
    setLoading(true);
    setMsg("");
    if (!navigator.geolocation) {
      setMsg("Geolocation not supported by your browser.");
      setLoading(false);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        GeoDeviceBaseline.location_enabled = true;
        GeoDeviceBaseline.location = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          city: "Locating...",
          display: "Locating...",
        };
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`)
          .then(r => r.json())
          .then(data => {
            const addr = data.address || {};
            const area = addr.neighbourhood || addr.quarter || addr.suburb || addr.residential || null;
            const city = addr.city || addr.town || addr.municipality || addr.village || addr.county || "Unknown";
            const state = addr.state || "";
            const display = area ? `${area}, ${city}, ${state}` : `${city}, ${state}`;
            GeoDeviceBaseline.location.city = city;
            GeoDeviceBaseline.location.area = area;
            GeoDeviceBaseline.location.region = state;
            GeoDeviceBaseline.location.display = display;
            setLoc(display);
            setMsg("✅ Location updated successfully");
            setTimeout(() => setMsg(""), 3000);
          })
          .catch(() => {
            setMsg("Could not fetch address. Try again.");
          })
          .finally(() => setLoading(false));
      },
      () => {
        setMsg("⚠️ Location permission denied. Please allow access in browser settings.");
        setLoading(false);
      },
      { timeout: 8000 }
    );
  }

  function saveManual(){
    if (!manual.trim()) return;
    // Only admins may set location manually — log it
    if (!user.isAdmin) {
      setMsg("❌ Manual location entry is not allowed.");
      setEditing(false);
      return;
    }
    GeoDeviceBaseline.location = {
      ...GeoDeviceBaseline.location,
      display: manual.trim(),
      city: manual.trim(),
      manual: true,
    };
    console.log(`[ADMIN OVERRIDE] ${user.name} set manual location: ${manual.trim()}`);
    setLoc(manual.trim());
    setEditing(false);
    setManual("");
    setMsg("✅ Location updated manually");
    setTimeout(() => setMsg(""), 3000);
  }

  return(
    <div style={{marginTop:16}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1A1C1A",marginBottom:10,
        display:"flex",alignItems:"center",gap:6}}>
        📍 Current Location
      </div>

      {/* Location display */}
      <div style={{background:"#FAFAF8",borderRadius:6,padding:"12px 16px",
        border:"1px solid #e8f1ff",marginBottom:12}}>
        {loc ? (
          <div style={{fontSize:13,fontWeight:600,color:"#1A1C1A"}}>
            📍 {loc}
            {GeoDeviceBaseline.location?.manual && (
              <span style={{fontSize:10,color:"#f59e0b",fontWeight:700,
                marginLeft:8,background:"#fef3c7",padding:"2px 7px",borderRadius:8}}>
                Manual
              </span>
            )}
          </div>
        ) : (
          <div style={{fontSize:13,color:"#75777D"}}>Location not captured yet</div>
        )}
        <div style={{fontSize:11,color:"#75777D",marginTop:4}}>
          💻 {GeoDeviceBaseline.deviceInfo
            ? `${GeoDeviceBaseline.deviceInfo.browser} · ${GeoDeviceBaseline.deviceInfo.os} · ${GeoDeviceBaseline.deviceInfo.timezone}`
            : "Device info unavailable"}
        </div>
      </div>

      {/* Message */}
      {msg && (
        <div style={{fontSize:12,fontWeight:600,
          color: msg.startsWith("✅") ? "#166534" : "#dc2626",
          marginBottom:10,padding:"6px 12px",borderRadius:8,
          background: msg.startsWith("✅") ? "#dcfce7" : "#fef2f2"}}>
          {msg}
        </div>
      )}

      {/* Manual edit input */}
      {editing && (
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <input
            value={manual}
            onChange={e => setManual(e.target.value)}
            onKeyDown={e => e.key === "Enter" && saveManual()}
            placeholder="e.g. Baner, Pune, Maharashtra"
            style={{flex:1,padding:"9px 13px",border:"1.5px solid #bfdbfe",borderRadius:4,
              fontSize:13,outline:"none",fontFamily:"'Inter',sans-serif"}}
          />
          <button onClick={saveManual}
            style={{padding:"9px 16px",background:"linear-gradient(135deg,#1B263B,#0F1E2E)",
              border:"none",borderRadius:4,color:"#fff",fontWeight:700,fontSize:13,
              cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>
            Save
          </button>
          <button onClick={() => setEditing(false)}
            style={{padding:"9px 14px",background:"#FDFCFB",border:"none",borderRadius:4,
              color:"#45474D",fontWeight:600,fontSize:13,cursor:"pointer",
              fontFamily:"'Inter',sans-serif"}}>
            Cancel
          </button>
        </div>
      )}

      {/* Action buttons */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button onClick={refreshLocation} disabled={loading}
          style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",
            background:"linear-gradient(135deg,#1B263B,#0F1E2E)",border:"none",
            borderRadius:4,color:"#fff",fontWeight:700,fontSize:12,
            cursor:loading?"not-allowed":"pointer",opacity:loading?0.6:1,
            fontFamily:"'Inter',sans-serif"}}>
          {loading ? "Detecting..." : "🔄 Refresh Location"}
        </button>
        {user.isAdmin && (
        <button onClick={() => { setEditing(e => !e); setMsg(""); }}
          style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",
            background:"rgba(27,38,59,0.04)",border:"1.5px solid #bfdbfe",
            borderRadius:4,color:"#C5A059",fontWeight:700,fontSize:12,
            cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>
          ✏️ Set Manually
        </button>
        )}
      </div>
    </div>
  );
}

      <Card style={{padding:22,marginBottom:16}}>

    </div>
  );
}


// ═══ js/pages/request-money.js ═══

function RequestMoneyPage({user, setPage}){
  const [recipient, setRecipient] = useState("");
  const [recipientType, setRecipientType] = useState("phone");
  const [recipientErr, setRecipientErr] = useState(""); // FEATURE: mobile validation error
  const [amt, setAmt] = useState("");
  const [note, setNote] = useState("");
  const [stage, setStage] = useState("form"); // form | success
  const [sentRequests, setSentRequests] = useState([]);

  const parsedAmt = parseFloat(amt) || 0;

  const getRecipientInfo = () => {
    let targetNum = recipient;
    if (recipientType === 'upi') {
      const u = Object.entries(USERS).find(([,v]) => v.upi === recipient);
      if (u) targetNum = u[0];
    }
    const inSystem = targetNum in USERS;
    const name = inSystem ? USERS[targetNum].name : recipient;
    return { targetNum, name, inSystem };
  };

  const { name: recipName, inSystem } = recipient ? getRecipientInfo() : { name: "", inSystem: false };
  const isReady = recipient && parsedAmt > 0 && note.trim();

  async function sendRequest() {
    // FEATURE: Validate recipient mobile is 10 digits for phone type
    if (recipientType === 'phone' && recipient.replace(/\D/,"").length !== 10) {
      setRecipientErr("Enter a valid 10-digit mobile number");
      return;
    }

    // === VPN Detection Check ===
    // Run this check before creating any payment request
    const vpnCheck = await checkVPNDetection(user.number);
    if (vpnCheck.vpnDetected) { // Phase 1A non-blocking
      alert("VPN detected. Please turn off VPN to proceed with payment.");
      return;
    }

    if (!isReady) return;
    const { targetNum, name } = getRecipientInfo();
    const { date, time } = nowStamp();
    const newReq = {
      id: Date.now(),
      to: name || recipient,
      toNum: targetNum,
      upi: inSystem ? USERS[targetNum]?.upi : recipient,
      amt: parsedAmt,
      reason: note,
      date,
      time,
      status: "pending",
      type: "sent_request"
    };

    // Record network info for VPN detection on the NEXT transaction.
    getNetworkInfo().then(netInfo => {
      recordTxNetwork(user.number, netInfo);
    });

    setSentRequests(prev => [newReq, ...prev]);
    setStage("success");
  }

  if (stage === "success") return (
    <div className="page-pad page-enter" style={{padding:40,display:"flex",flexDirection:"column",
      alignItems:"center",minHeight:"60vh",justifyContent:"center"}}>
      <div style={{background:"#fff",border:"1px solid #E0E1DD",borderRadius:8,padding:"40px 34px",maxWidth:380,width:"100%",
        boxShadow:"0 20px 56px rgba(27,38,59,.08)",textAlign:"center",animation:"scaleIn .4s cubic-bezier(.16,1,.3,1)"}}>
        <div style={{width:80,height:80,borderRadius:"50%",
          background:"#F8F4EB",border:"1.5px solid #C5A059",
          display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",
          boxShadow:"0 8px 24px rgba(197,160,89,.18)"}}>
          <svg width="40" height="40" viewBox="0 0 40 40">
            <polyline points="8 20 16 28 32 12" fill="none" stroke="#1B263B" strokeWidth="3.5"
              strokeLinecap="round" strokeLinejoin="round"
              strokeDasharray="36" strokeDashoffset="36"
              style={{animation:"drawCheck .4s .1s ease forwards"}}/>
          </svg>
        </div>
        <h2 style={{color:"#1B263B",fontSize:22,fontWeight:800,marginBottom:8,letterSpacing:"-.01em"}}>Request Sent!</h2>
        <p style={{color:"#45474D",marginBottom:4,fontSize:15}}>
          You requested <b style={{color:"#1A1C1A"}}>₹{parsedAmt.toLocaleString("en-IN")}</b> from
        </p>
        <p style={{color:"#1B263B",fontWeight:700,marginBottom:20,fontSize:15}}>
          {getRecipientInfo().name || recipient}
        </p>
        <p style={{fontSize:13,color:"#45474D",marginBottom:24,lineHeight:1.5}}>
          They will receive a notification to approve and pay you.
        </p>
        <div style={{display:"flex",gap:10}}>
          <Btn onClick={()=>{setStage("form");setRecipient("");setAmt("");setNote("");}} variant="primary" style={{flex:1}}>
            New Request
          </Btn>
          <Btn onClick={()=>setPage("dashboard")} variant="secondary" style={{flex:1}}>Dashboard</Btn>
        </div>
      </div>
    </div>
  );

  return (
    <div className="page-pad page-enter" style={{padding:24,maxWidth:780,margin:"0 auto"}}>
      <PageHeader
        title="Request Money"
        subtitle="Ask someone to send you money — they pay, you receive"
        onBack={() => setPage("dashboard")}
      />

      {/* Info banner — gold accent to match app theme */}
      <div style={{padding:"12px 16px",background:"#F8F4EB",border:"1px solid #C5A059",
        borderRadius:6,marginBottom:20,display:"flex",alignItems:"flex-start",gap:10}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B263B" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p style={{fontSize:13,color:"#1B263B",margin:0,lineHeight:1.5}}>
          <strong style={{fontWeight:700}}>Requesting money:</strong> You are asking someone else to pay you. Money will be credited to your account only after they approve. You will <strong>NOT</strong> send any money.
        </p>
      </div>

      <Card style={{padding:24}}>
        {/* Recipient type toggle */}
        <div style={{marginBottom:18}}>
          <div style={{display:"flex",gap:10,marginBottom:14,background:"#F8F9FB",
            padding:4,borderRadius:8,border:"1px solid #E0E1DD"}}>
            {["phone","upi"].map(t => {
              const active = recipientType === t;
              return (
                <button key={t} onClick={() => { setRecipientType(t); setRecipient(""); setRecipientErr(""); }}
                  style={{flex:1,padding:"9px 12px",borderRadius:6,cursor:"pointer",
                    fontFamily:"'Inter',sans-serif",fontWeight:600,fontSize:13,
                    display:"flex",alignItems:"center",justifyContent:"center",gap:7,
                    border:active?"1px solid #1B263B":"1px solid transparent",
                    background:active?"#1B263B":"transparent",
                    color:active?"#fff":"#45474D",
                    transition:"all .15s ease"}}>
                  {t === "phone"
                    ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={active?"#C5A059":"#64748b"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                    : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={active?"#C5A059":"#64748b"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="5" x2="18" y2="5"/><line x1="6" y1="10" x2="18" y2="10"/><path d="M6 10l6 9M14 10c0 2.5-2 4-4 4"/></svg>}
                  {t === "phone" ? "Mobile Number" : "UPI ID"}
                </button>
              );
            })}
          </div>

          <label style={{fontSize:12,fontWeight:700,color:"#1A1C1A",display:"block",marginBottom:7,letterSpacing:".03em",textTransform:"uppercase"}}>
            Request From ({recipientType === 'phone' ? 'Mobile Number' : 'UPI ID'})
          </label>
          <input

            placeholder={recipientType === 'phone' ? "10-digit mobile number" : "example@ironwallet"}

              color:"#1A1C1A",background:"#fff",fontFamily:"'Inter',sans-serif",

              borderRadius:8,fontSize:13,color:"#166534",display:"flex",alignItems:"center",
              gap:7,flexWrap:"wrap"}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#166534" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <strong style={{fontWeight:700}}>{USERS[recipient].name}</strong>
              {USERS[recipient].verified && (
                <span style={{fontSize:11,background:"#F8F4EB",color:"#1B263B",
                  padding:"2px 8px",borderRadius:4,fontWeight:700,border:"1px solid #C5A059"}}>✔ Verified</span>
              )}
            </div>
          )}
          {recipient && !inSystem && recipientType === 'phone' && (
            <div style={{marginTop:8,padding:"8px 12px",background:"#FFF7ED",border:"1px solid #FED7AA",
              borderRadius:8,fontSize:12,color:"#9a3412",fontWeight:600,
              display:"flex",alignItems:"center",gap:6}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea580c" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              This number is not on IronWallet — request may not be delivered
            </div>

        </div>

        {/* Amount */}
        <div style={{marginBottom:18}}>

          ))}

      )}

  );
}

// ===== TOAST NOTIFICATION =====
function useToast(){
  const[toast,setToast]=useState(null);
  function showToast(msg,ms=2500){
    setToast(msg);
    setTimeout(()=>setToast(null),ms);
  }
  const ToastEl=toast?(
    <div className="pt-toast">{toast}</div>
  ):null;
  return{showToast,ToastEl};
}


// ===== SMART GUARD GAME =====
function SmartGuardGame({onComplete}) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [gameOver, setGameOver] = useState(false);

  const POOL = [
    // Scam or Legit - 5 questions
    { id: 1, type: 'scamlegit', question: 'You receive an SMS: "Your bank account will be frozen. Click here to verify your details immediately."', options: ['Scam', 'Legit'], correctAnswer: 0 },
    { id: 2, type: 'scamlegit', question: 'Your UPI app shows a notification: "Welcome! Tap to claim ₹500 cashback. No verification needed."', options: ['Scam', 'Legit'], correctAnswer: 0 },
    { id: 3, type: 'scamlegit', question: 'You get a call from your bank asking for your full ATM pin to unblock your card.', options: ['Scam', 'Legit'], correctAnswer: 0 },
    { id: 4, type: 'scamlegit', question: 'An email from your bank says: "Update your KYC now or your account will be suspended."', options: ['Scam', 'Legit'], correctAnswer: 0 },
    { id: 5, type: 'scamlegit', question: 'You win a lottery message saying you can withdraw ₹10,000 by paying ₹500 processing fee.', options: ['Scam', 'Legit'], correctAnswer: 0 },
    // Spot the Red Flag - 5 questions
    { id: 6, type: 'redflag', question: 'A stranger sends you ₹500 on UPI and calls: "I made a mistake, please return it to this number."', options: ['Safe', 'Red Flag'], correctAnswer: 1 },
    { id: 7, type: 'redflag', question: 'A "bank executive" calls and says your Aadhaar is linked to illegal activities and asks for OTP.', options: ['Safe', 'Red Flag'], correctAnswer: 1 },
    { id: 8, type: 'redflag', question: 'Your friend asks you to transfer ₹2000 via UPI as they are stuck without cash.', options: ['Safe', 'Red Flag'], correctAnswer: 0 },
    { id: 9, type: 'redflag', question: 'A website promises 50% cashback on first recharge if you enter your UPI PIN on their page.', options: ['Red Flag', 'Safe'], correctAnswer: 0 },
    { id: 10, type: 'redflag', question: 'You receive a link to track your delivery, it asks for your card number to confirm.', options: ['Red Flag', 'Safe'], correctAnswer: 0 },
    // Escape Room - 5 questions
    { id: 11, type: 'escape', question: 'You accidentally tap an unknown UPI link. What do you do first?', options: ['Enter your details', 'Close the app', 'Tell a family member', 'Call the police'], correctAnswer: 2 },
    { id: 12, type: 'escape', question: 'Your bank calls asking for UPI PIN. What should you do?', options: ['Give the PIN', 'Hang up and call bank official number', 'Ask them to verify first', 'Ignore the call'], correctAnswer: 1 },
    { id: 13, type: 'escape', question: 'You see ₹5000 credited by mistake. The sender asks for it back. What do you do?', options: ['Ignore', 'Transfer immediately', 'Report to bank', 'Block them'], correctAnswer: 2 },
    { id: 14, type: 'escape', question: 'OTP for a transaction you did not initiate arrives. What next?', options: ['Share with caller', 'Enter on unknown app', 'Delete and ignore', 'Tell everyone'], correctAnswer: 2 },
    { id: 15, type: 'escape', question: 'Someone creates a fake ID of you on social media. What should you do first?', options: ['Create fake ID of them', 'Report to cyber crime', 'Ignore it', 'Hack their account'], correctAnswer: 1 },
  ];

  const questions = useMemo(() => {
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    return shuffle(POOL).slice(0, 5);
  }, []);

  function handleSelect(idx) {
    if (selected !== null) return;
    setSelected(idx);
    setShowResult(true);
    if (idx === questions[currentIdx].correctAnswer) {
      setCorrectCount(c => c + 1);
    }
  }

  function handleNext() {
    if (currentIdx < 4) {
      setCurrentIdx(currentIdx + 1);
      setSelected(null);
      setShowResult(false);
    } else {
      // Game finished - save coins to localStorage
      const earned = correctCount * 5;
      const coins = parseInt(localStorage.getItem('coins') || '0');
      localStorage.setItem('coins', coins + earned);
      localStorage.setItem('lastPlayedDate', new Date().toDateString());
      setGameOver(true);
    }
  }

  function handleFinish() {
    onComplete();
  }

  if (gameOver) {
    const earned = correctCount * 5;
    return (
      <Modal>
        <div style={{ background: '#fff', borderRadius: 24, padding: 32, maxWidth: 360, width: '90vw', textAlign: 'center', animation: 'scaleIn .3s ease' }}>
          <div style={{ width: 72, height: 72, borderRadius: 22, background: 'linear-gradient(135deg,#8b5cf6,#6d28d9)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px', boxShadow: '0 8px 24px rgba(139,92,246,.35)' }}>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <h3 style={{ fontSize: 22, fontWeight: 800, color: '#0f172a', marginBottom: 6 }}>Game Completed!</h3>
          <p style={{ fontSize: 14, color: '#64748b', marginBottom: 20, lineHeight: 1.5 }}>Great job testing your fraud detection skills!</p>
          <div style={{ background: '#f0f6ff', borderRadius: 16, padding: '18px', marginBottom: 14 }}>
            <div style={{ fontSize: 14, color: '#64748b', fontWeight: 600, marginBottom: 4 }}>Total Correct Answers</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: '#0f172a' }}>{correctCount} out of 5</div>
          </div>
          <div style={{ background: '#dcfce7', borderRadius: 16, padding: '18px', marginBottom: 22 }}>
            <div style={{ fontSize: 13, color: '#64748b', fontWeight: 600, marginBottom: 4 }}>Coins Earned</div>
            <div style={{ fontSize: 38, fontWeight: 800, color: '#1B263B' }}>🪙 {earned}</div>
          </div>
          <button onClick={handleFinish} style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg,#1B263B,#0F1E2E)', color: '#fff', border: 'none', borderRadius: 14, fontSize: 15, fontWeight: 700, cursor: 'pointer', fontFamily: "'DM Sans',sans-serif", boxShadow: '0 6px 20px rgba(0,120,255,.3)' }}>
            Back to Dashboard
          </button>
        </div>
      </Modal>
    );
  }

  const q = questions[currentIdx];
  const typeLabel = q.type === 'scamlegit' ? 'Scam or Legit' : q.type === 'redflag' ? 'Red Flag' : 'Escape Room';
  return (
    <Modal>
      <div style={{ background: '#fff', borderRadius: 24, padding: 28, maxWidth: 420, width: '90vw', animation: 'scaleIn .3s ease' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: '#1B263B', background: 'rgba(197,160,89,0.08)', padding: '4px 12px', borderRadius: 20 }}>
            Question {currentIdx + 1} of 5
          </span>
          <span style={{ fontSize: 12, fontWeight: 600, color: '#8b5cf6', background: '#f5f3ff', padding: '4px 10px', borderRadius: 20 }}>
            {typeLabel}
          </span>
        </div>
        <div style={{ background: '#f8faff', borderRadius: 14, padding: '16px', marginBottom: 20 }}>
          <p style={{ fontSize: 15, fontWeight: 700, color: '#0f172a', lineHeight: 1.5 }}>{q.question}</p>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {q.options.map((opt, i) => {
            let bg = '#f0f6ff';
            let bd = '#dbeafe';
            let color = '#0f172a';
            let cursor = 'pointer';
            if (showResult) {
              if (i === q.correctAnswer) { bg = '#dcfce7'; bd = '#86efac'; color = '#166534'; }
              else if (i === selected && i !== q.correctAnswer) { bg = '#fef2f2'; bd = '#fca5a5'; color = '#dc2626'; }
              cursor = 'default';
            } else if (selected === i) {
              bg = '#e8f1ff'; bd = '#C5A059';
            }
            return (
              <button key={i} onClick={() => handleSelect(i)} disabled={selected !== null}
                style={{ padding: '14px 16px', background: bg, border: `2px solid ${bd}`, borderRadius: 14, fontSize: 14, fontWeight: 600, color, cursor, fontFamily: "'DM Sans',sans-serif", textAlign: 'left', transition: 'all .2s' }}>
                {opt}
              </button>
            );
          })}
        </div>
        {showResult && (
          <div style={{ marginTop: 16, display: 'flex', justifyContent: 'flex-end' }}>
            <button onClick={handleNext} style={{ padding: '10px 24px', background: '#1B263B', color: '#fff', border: 'none', borderRadius: 12, fontSize: 14, fontWeight: 700, cursor: 'pointer', fontFamily: "'DM Sans',sans-serif", boxShadow: '0 4px 14px rgba(0,120,255,.3)' }}>
              {currentIdx < 4 ? 'Next →' : 'See Results'}
            </button>
          </div>
        )}
      </div>
    </Modal>
  );
}

// ===== FEATURE 6: RISK EXPLAINER TAGS =====
function RiskExplainer({tx, user}){
  if(!tx) return null;
  const avg=calculateAvgTransaction(user);
  const tags=[];
  const inContacts=tx.toNum&&(tx.toNum in(user.contacts||{}));
  const inHistory=tx.toNum&&user.known_recipients?.has(tx.toNum);
  const inUPI=tx.toNum&&(tx.toNum in USERS);

  if(tx.amt>avg*3) tags.push({label:`${Math.round(tx.amt/Math.max(avg,1))}× your avg amount`,color:"#ba1a1a",bg:"#fef2f2",border:"#fca5a5"});
  if(!inContacts&&!inHistory&&tx.type==="debit") tags.push({label:"New recipient",color:"#f59e0b",bg:"#fef3c7",border:"#fcd34d"});
  if(!inUPI&&tx.type==="debit") tags.push({label:"Off-network recipient",color:"#ba1a1a",bg:"#fef2f2",border:"#fca5a5"});
  const h=tx.time?parseInt(tx.time.split(":")[0]):12;
  if(h>=1&&h<5) tags.push({label:"Late-night (1–5AM)",color:"#7c3aed",bg:"#f5f3ff",border:"#c4b5fd"});
  if(tx.otp_used) tags.push({label:"OTP verified",color:"#22c55e",bg:"#dcfce7",border:"#86efac"});
  if(tx.status==="high_risk" || t.status==="blocked") tags.push({label:"High Risk — high risk",color:"#ba1a1a",bg:"#fef2f2",border:"#fca5a5"});
  const recRisk=getRecipientRisk(tx.toNum||"");
  const recReason=getRecipientReportReason(tx.toNum||"");
  if(recRisk>=1&&recReason) tags.push({label:`Reported for ${recReason}`,color:"#ba1a1a",bg:"#fef2f2",border:"#fca5a5"});
  else if(recRisk>=2) tags.push({label:`Flagged ${recRisk}× network-wide`,color:"#ba1a1a",bg:"#fef2f2",border:"#fca5a5"});
  if(tx.risk<40&&!tags.length) tags.push({label:"Low risk",color:"#22c55e",bg:"#dcfce7",border:"#86efac"});

  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:6}}>
      {tags.map((t,i)=>(
        <span key={i} className="risk-tag"
          style={{color:t.color,background:t.bg,borderColor:t.border,fontSize:10,padding:"3px 9px",borderRadius:6,fontWeight:700}}>
          {t.label}
        </span>
      ))}
    </div>
  );
}

/* ═══ FRAUD SEVERITY HELPERS ═══ */
function getFraudSeverity(reason) {
  if (reason.includes("Unauthorized") || reason.includes("Fraud")) return "HIGH";
  if (reason.includes("Wrong") || reason.includes("wrong")) return "MEDIUM";
  if (reason.includes("Failed") || reason.includes("deducted")) return "LOW";
  return "MEDIUM";
}
function getSeverityMeta(severity) {
  if (severity === "HIGH") return { color: "#dc2626", bg: "#fef2f2", border: "#fca5a5", emoji: "🔴", label: "Under Review", badge: "#450a0a", resolution: "0–24 Hours", sublabel: "Investigation Underway" };
  if (severity === "MEDIUM") return { color: "#d97706", bg: "#fffbeb", border: "#fcd34d", emoji: "🟡", label: "Under Review", badge: "#78350f", resolution: "2–5 Days", sublabel: "Standard Review" };
  return { color: "#16a34a", bg: "#f0fdf4", border: "#86efac", emoji: "🟢", label: "Under Review", badge: "#14532d", resolution: "1–3 Days", sublabel: "Processing" };
}
function generateRefId() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let id = "CFCFRMS-IND-2026-";
  for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}
function getAIRiskInsights(tx) {
  const insights = [];
  const riskLevel = tx.risk >= 70 ? "HIGH" : tx.risk >= 40 ? "MEDIUM" : "LOW";
  if (tx.risk >= 70) insights.push({ icon: "⚠️", label: "High Risk Transaction", desc: `Risk score ${tx.risk}/100 — flagged` });
  if (!tx.otp_used && tx.type === "debit") insights.push({ icon: "🔐", label: "No OTP Verified", desc: "Transaction not verified via OTP" });
  if (tx.location && tx.location.toLowerCase().includes("unknown")) insights.push({ icon: "📍", label: "Unusual Location", desc: tx.location });
  if (tx.risk_tag === "new_device") insights.push({ icon: "📱", label: "New Device Detected", desc: "Login from unrecognized device" });
  if (tx.risk >= 50) insights.push({ icon: "💸", label: "Large Amount", desc: `₹${tx.amt?.toLocaleString("en-IN")} — unusual for this account` });
  return { insights, riskLevel, riskPercent: tx.risk || 0 };
}

Risk Score: ${user?.risk_score??0}/100
Freeze Level: ${freezeLevel} — ${freezeLabel}
Bypass Attempts: ${user?.bypass_attempts??0}, High-Risk Flags: ${user?.blocked_attempts??0}
Frozen: ${user?.permanent_frozen?'YES Permanent':user?.frozen_until?'YES Temporary':'No'}
Avg Transaction: ₹${avgAmt.toLocaleString('en-IN')}
High Value Threshold: ₹${hvThreshold.toLocaleString('en-IN')}
Spent Today: ₹${spentToday.toLocaleString('en-IN')}

=== LAST 5 TRANSACTIONS ===
${txLines}

=== RISK SYSTEM ===
0-69: SAFE | 70-84: CAUTION | 85-100: HIGH_RISK

=== FREEZE LEVELS ===
0=SAFE | 1=CAUTION | 2=CAUTION | 3=HIGH_RISK | 4=HIGH_RISK | 5=HIGH_RISK

=== FRAUD PATTERNS DETECTED BY APP ===
KYC fraud, OTP phishing, fake refunds, govt impersonation (RBI/CBI/UIDAI),
remote access scams (AnyDesk/TeamViewer), micro-payment attacks,
balance drain (>80% in one tx), late night tx (1-5AM), unverified new recipient

=== APP FEATURES ===
Freeze: Profile page → Emergency Lock
Report fraud: History page → Report button on any transaction
Risk score: visible on Dashboard
OTP: auto-triggered for high-risk payments
Helpline: 1800-123-4567 (24x7)
Cybercrime: 1930 or cybercrime.gov.in

Use user's actual data above for personalized answers.`;
  }

  const handleSend = async (msgText) => {
    const text = (msgText ?? input).trim();
    if (!text || loading || rateLimited) return;
    setMessages(prev => [...prev, { role:'user', text }]);
    setInput("");
    setLoading(true);

    const history = messages.slice(1).slice(-10).map(m => ({
      role: m.role==='user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));

    try {
      // Proxy through backend — API key never leaves server (otp_server.py:484 POST /assistant)
      const response = await fetch(`${API}/assistant`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          user_profile: {
            name: user?.name,
            age: user?.age,
            balance: user?.balance,
            upi: user?.upi,
            verified: user?.verified,
            risk_score: user?.risk_score,
            freeze_level: getFreezeLevel(user),
            freeze_label: getFreezeLevelLabel(getFreezeLevel(user)),
            avg_amount: Math.round(calculateAvgTransaction(user)),
            high_value_threshold: Math.round(getHighValueThreshold(user)),
            spent_today: Math.round(getDailySpent(user))
          },
          recent_transactions: (txs || []).slice(0, 5).map(t => ({
            type: t.type, amt: t.amt, to: t.to, from: t.from,
            date: t.date, time: t.time, risk: t.risk, status: t.status, otp_used: t.otp_used
          })),
          history: history.map(h => ({ role: h.role, text: h.parts?.[0]?.text || "" }))
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(()=>({}));
        // Surface backend 429/503/504 with proper message instead of generic HTTP error
        const msg = err?.error || err?.message || `HTTP ${response.status}`;
        if (response.status === 503) throw new Error(msg);
        if (response.status === 429) throw new Error("429 " + msg);
        if (response.status === 504) throw new Error(msg);
        throw new Error(msg);
      }

      const data = await response.json();
      const reply = data?.reply || data?.error || "Sorry, I couldn't get a response. Please try again.";
      const cleaned = (reply || "Sorry, I couldn't get a response. Please try again.")
        .replace(/\*\*(.*?)\*\*/g,'$1')
        .replace(/\*(.*?)\*/g,'$1')
        .replace(/#{1,3} /g,'')
        .replace(/`(.*?)`/g,'$1')
        .trim();

      setMessages(prev => [...prev, { role:'bot', text: cleaned }]);

    } catch(err) {
      console.error("Nexus error:", err);
      const isRateLimit = err.message?.includes("429") ||
        err.message?.toLowerCase().includes("quota") ||
        err.message?.toLowerCase().includes("exceeded");

      if (isRateLimit) {
        let secs = 60;
        setRateLimited(true);
        setRateLimitTimer(secs);
        timerRef.current = setInterval(() => {
          secs -= 1;
          setRateLimitTimer(secs);
          if (secs <= 0) {
            clearInterval(timerRef.current);
            setRateLimited(false);
            setRateLimitTimer(0);
          }
        }, 1000);
        setMessages(prev => [...prev, { role:'bot',
          text:"⏳ Too many requests right now. Please wait 60 seconds and try again." }]);
      } else {
        setMessages(prev => [...prev, { role:'bot',
          text:`⚠️ Something went wrong: ${err.message||"Please check your connection."}` }]);
      }
    } finally {
      setLoading(false);
    }
  };

  const handleQuickReply = (text) => handleSend(text);

  return (
      <div style={{position:"fixed",bottom:100,right:28,zIndex:1000,
        width:380,maxWidth:"calc(100vw - 32px)",height:540,maxHeight:"calc(100vh - 140px)",
        background:"#fff",borderRadius:16,boxShadow:"0 12px 48px rgba(0,0,0,.28)",
        border:"1px solid #e2e8f0",
        display:"flex",flexDirection:"column",overflow:"hidden"}}>

          <div style={{background:`linear-gradient(135deg,#1B263B,#0F1E2E)`,padding:"16px 20px",
            display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:"rgba(255,255,255,.2)",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:900,
                color:"#fff",fontFamily:"'Arial Black','Impact',sans-serif",letterSpacing:"1px"}}>N</div>
              <div>
                <div style={{color:"#fff",fontWeight:800,fontSize:15}}>Nexus</div>
                <div style={{color:"rgba(255,255,255,.7)",fontSize:11}}>
                  {loading?"Thinking...":"AI Security Assistant"}
                </div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {messages.length > 1 && (
                <button onClick={()=>{
                  setMessages([{role:'bot',text:"👋 Hello! I'm Nexus. How can I help you stay safe today?"}]);
                  try{localStorage.removeItem(`nexus_history_${user?.number}`);}catch{}
                }} style={{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",
                  fontSize:10,fontWeight:700,padding:"4px 10px",borderRadius:6,cursor:"pointer"}}>
                  Clear
                </button>
              )}
              <button onClick={onClose} style={{background:"none",border:"none",color:"#fff",cursor:"pointer"}}>
                <svg width="20"height="20"viewBox="0 0 24 24"fill="none"stroke="#fff"strokeWidth="2.5">
                  <line x1="18"y1="6"x2="6"y2="18"/><line x1="6"y1="6"x2="18"y2="18"/>
                </svg>
              </button>
            </div>
          </div>

          <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:"12px"}}>
            {messages.map((msg,i) => (
              <div key={i} style={{display:"flex",flexDirection:"column",
                alignItems:msg.role==='user'?'flex-end':'flex-start'}}>
                <div style={{maxWidth:"82%",padding:"10px 14px",
                  borderRadius:msg.role==='user'?'16px 16px 4px 16px':'4px 16px 16px 16px',
                  background:msg.role==='user'?`linear-gradient(135deg,#1B263B,#0F1E2E)`:'#f1f5f9',
                  color:msg.role==='user'?'#fff':'#0f172a',
                  whiteSpace:"pre-wrap",fontSize:14,lineHeight:1.55}}>
                  {msg.text}
                </div>
                <div style={{fontSize:10,color:"#75777D",marginTop:2}}>
                  {new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
                </div>
              </div>
            ))}

            {messages.length === 1 && (
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
                {quickReplies.map((qr,idx) => (
                  <button key={idx} className="quick-reply-btn"
                    onClick={()=>handleQuickReply(qr)}
                    disabled={loading||rateLimited}>{qr}</button>
                ))}
              </div>
            )}

            {loading && (
              <div style={{display:"flex",gap:5,padding:"10px 14px",background:"#FDFCFB",
                borderRadius:"4px 16px 16px 16px",width:"fit-content"}}>
                {[0,0.2,0.4].map((d,i)=>(
                  <div key={i} style={{width:8,height:8,borderRadius:"50%",background:"#94a3b8",
                    animation:`blink 1s infinite ${d}s`}}/>
                ))}
              </div>
            )}
            <div ref={messagesEndRef}/>
          </div>

          {rateLimited && (
            <div style={{textAlign:"center",fontSize:12,color:"#f59e0b",fontWeight:600,
              padding:"6px 16px",background:"#fffbeb",borderTop:"1px solid #fde68a"}}>
              ⏳ Too many requests — wait {rateLimitTimer}s
            </div>
          )}

          <div style={{padding:"12px",borderTop:"1px solid #E0E1DD",display:"flex",gap:8}}>
            <input value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&handleSend()}
              placeholder={rateLimited?`Wait ${rateLimitTimer}s...`:"Ask about fraud safety..."}
              disabled={rateLimited}
              style={{flex:1,padding:"10px 14px",border:"1px solid #E0E1DD",borderRadius:22,
                fontSize:13,outline:"none",fontFamily:"'Inter',sans-serif",
                opacity:rateLimited?0.5:1}}/>
            <button onClick={()=>handleSend()}
              disabled={!input.trim()||loading||rateLimited}
              style={{width:40,height:40,borderRadius:"50%",
                background:`linear-gradient(135deg,#1B263B,#0F1E2E)`,
                border:"none",cursor:(loading||rateLimited)?"not-allowed":"pointer",
                opacity:(loading||rateLimited)?0.5:1,
                display:"flex",alignItems:"center",justifyContent:"center"}}>
              <svg width="16"height="16"viewBox="0 0 24 24"fill="none"stroke="#fff"strokeWidth="2.5">
                <line x1="22"y1="2"x2="11"y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>

      </div>
  );
}
